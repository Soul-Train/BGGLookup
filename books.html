function findLoaded(id){
  if (game && game.id === id) return game;
  var r = shelf.filter(function(x){ return x.game && x.game.id === id; })[0];
  return r ? r.game : (STARRED[id] || null);
}

/* ============================ actions =========================== */
function fail(e){
  if (e && e.message === "PASSWORD") return;     // the password screen explains it
  msg = "<b>Something went wrong</b>" + esc(e && e.message ? e.message : String(e));
  msgBad = true;
}

function needToken(){ return false; }   // the server holds the keys

function openGame(id){
  if (needToken()) return;
  busy = "Loading the book"; screen = "busy"; showShot = false; render();
  loadOne(id)
    .then(function(g){
      game = g; PT_SEL = -1;
      rememberOne(g);
      // Show the placeholder straight away if there is anything to summarise.
      g.saysState = (g.comments && g.comments.length) ? "loading" : "none";
      screen = "detail"; render();
      if (g.saysState === "none") return;        // nothing to summarise, so say nothing
      // Never leave the placeholder up indefinitely: give up after 25 seconds.
      var timeout = new Promise(function(res){ setTimeout(function(){ res("timeout"); }, 25000); });
      return Promise.race([summarise(g).catch(function(){ return "failed"; }), timeout])
        .then(function(s){
          if (!game || game.id !== g.id) return;
          if (s && s.length && typeof s !== "string"){ game.says = s; game.saysState = "done"; }
          else game.saysState = (s === "timeout" || s === "failed" || s === null) ? "failed" : "none";
          render();
        });
    })
    .catch(function(e){
      fail(e);
      picks = [{ id: id, name: "This book" }];
      screen = shelf.length ? "shelf" : "picks"; render();
    });
}

function byName(q){
  if (needToken()) return;
  var m = String(q).match(/^(.*?)\s+by\s+(.+)$/i);
  busy = "Searching Hardcover"; screen = "busy"; render();
  findId(m ? m[1] : q, m ? m[2] : "").then(function(id){
    if (!id){ msg = "<b>No match</b>Nothing on Hardcover matched \u201c"+esc(q)+"\u201d.";
      msgBad = true; screen = "idle"; render(); return; }
    openGame(id);
  }).catch(function(e){ fail(e); screen = "idle"; render(); });
}

function submitManual(){
  var v = (document.getElementById("q").value||"").trim();
  if (!v) return;
  if (/^[0-9][0-9\s-]{8,16}[0-9Xx]$/.test(v)) lookup(v); else byName(v);
}

/* --- barcode --- */
var fixTarget = null;

function startCamera(target){
  msg = null; busyNote = "";
  fixTarget = (typeof target === "number") ? target : null;
  if (!("BarcodeDetector" in window)){
    msg = "<b>This browser cannot scan barcodes</b>Chrome on Android works. On iPhone, "+
          "photograph the cover instead, or type the ISBN.";
    msgBad = true; screen = "idle"; render(); return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    msg = "<b>No camera available</b>Type the barcode number instead.";
    msgBad = true; screen = "idle"; render(); return;
  }
  detector = detector || new window.BarcodeDetector({
    formats: ["ean_13","upc_a","ean_8","upc_e"] });
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" } }, audio:false })
    .then(function(s){ stream = s; screen = "scanning"; scanning = true; render(); tick(); })
    .catch(function(){
      msg = "<b>Camera blocked</b>Allow camera access in your browser settings, "+
            "or type the number instead.";
      msgBad = true; screen = "idle"; render();
    });
}

function stopCamera(){
  scanning = false;
  if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  if (screen === "scanning"){ screen = "idle"; render(); }
}

function tick(){
  if (!scanning) return;
  var v = document.getElementById("cam");
  if (v && v.readyState >= 2){
    detector.detect(v).then(function(codes){
      if (!scanning) return;
      if (codes && codes.length){
        // Books often show the ISBN and a small 5-digit price code side by side.
        // Prefer the ISBN if both are in view, and ignore the price code alone.
        var vals = codes.map(function(c){ return String(c.rawValue||"").replace(/\D/g,""); });
        var raw = vals.filter(function(v){ return /^97[89]/.test(v); })[0] ||
                  vals.filter(function(v){ return v.length >= 10; })[0];
        if (raw){ stopCamera(); lookup(raw); return; }
      }
      requestAnimationFrame(tick);
    }).catch(function(){ requestAnimationFrame(tick); });
  } else requestAnimationFrame(tick);
}

function lookup(code){
  var keepFix = fixTarget;
  if (keepFix !== null && shelf[keepFix]) startCorrection();
  else newCapture();
  fixTarget = keepFix;
  var c = classifyCode(code);
  if (c.kind !== "isbn"){
    msg = c.kind === "upc"
      ? "<b>That's a store barcode, not the ISBN</b>Some paperbacks print a UPC on the back. "+
        "Look inside the front cover for the ISBN, or photograph the cover."
      : c.kind === "addon"
      ? "<b>That's the price code</b>Aim at the bigger barcode beside it, the one starting 978."
      : "<b>That doesn't look like an ISBN</b>Book ISBNs are 10 or 13 digits; the 13-digit ones start 978 or 979.";
    msgBad = true; picks = []; screen = "picks"; render(); return;
  }
  lastUPC = c.isbn13;
  busy = "Looking up ISBN " + c.isbn13; screen = "busy"; render();
  findIsbn(c.isbn13, c.isbn10).then(function(id){
    if (id) return id;
    busy = "Finding this edition\u2019s title"; busyNote = "Hardcover doesn\u2019t list this exact edition"; render();
    return olIsbn(c.isbn13).then(function(t){
      if (!t) return null;
      busy = "Looking for \u201c" + t.title + "\u201d on Hardcover"; render();
      return findMatch(t.title, t.author).then(function(m){
        if (m && m.ok){ LC.set("b:isbn:" + c.isbn13, m.id); return m.id; }
        if (m) picks = [{ id: m.id, name: m.title || t.title }];   // close, but let you confirm
        searchedFor = t.title + (t.author ? " by " + t.author : "");
        return null;
      });
    });
  }).then(function(id){
    busyNote = "";
    if (!id){ screen = "picks"; render(); return; }
    if (fixTarget !== null) return replaceRowById(fixTarget, id);
    openGame(id);
  }).catch(function(e){
    if (e && e.message === "PASSWORD") return;
    msg = "<b>Could not reach Hardcover</b>Check your signal, or photograph the cover.";
    msgBad = true; picks = []; screen = "picks"; render();
  });
}

/* --- photo --- */
function newCapture(){
  // Anything left from the last scan should not linger behind the next one.
  game = null; picks = []; shelf = []; reads = []; EXP = {};
  lastUPC = ""; searchedFor = ""; shotURL = null; fixTarget = null;
  sortKey = "shelf"; sortDir = 1; msg = null; busyNote = "";
}

// Correcting a single row is not a new capture: the rest of the shelf stays.
function startCorrection(){
  game = null; picks = []; lastUPC = ""; searchedFor = "";
  shotURL = null; msg = null; busyNote = "";
}

function readPhoto(file, fixIndex){
  var correcting = (typeof fixIndex === "number" && shelf[fixIndex]);
  if (correcting){ startCorrection(); fixTarget = fixIndex; }
  else newCapture();
  shotURL = URL.createObjectURL(file);
  busy = "Reading the spines"; screen = "busy"; showShot = true; render();
  var T0 = Date.now(), T1 = 0, T2 = 0;
  readTitles(file).then(function(list){
    T1 = Date.now();
    if (!list.length) throw new Error("No titles were legible. Get closer, or turn the phone so the spines read upright.");
    reads = list;
    busy = "Matching " + list.length + " on Hardcover"; render();
    return Promise.all(list.map(function(o){
      return findMatch(o.title, o.author).then(function(m){
        return { read: o.author ? o.title + " by " + o.author : o.title,
                 id: m ? m.id : null, conf: o.sure && !(m && !m.ok),
                 why: m && !m.ok ? "Closest match on Hardcover; may be a different book" : o.why };
      });
    }));
  }).then(function(found){
    T2 = Date.now();
    var ids = found.filter(function(f){ return f.id; }).map(function(f){ return f.id; });
    return (ids.length ? loadMany(ids) : Promise.resolve({})).then(function(det){
      var T3 = Date.now();
      lastTiming = { read: T1 - T0, match: T2 - T1, details: T3 - T2, at: T3 };
      var rows = found.map(function(f){
        return { read:f.read, conf:f.conf, why:f.why, game: (f.id && det[f.id]) || null };
      });

      if (correcting){
        // Put the best read into the row being corrected and go back to the list.
        var pick = rows.filter(function(r){ return r.game; })[0] || rows[0];
        var fixedAt = fixTarget;
        shelf[fixTarget] = { read: pick.read, conf: pick.conf !== false, game: pick.game };
        fixTarget = null;
        if (rows.length > 1)
          msg = "<b>Read " + rows.length + " titles</b>Used the first match for that row.";
        if (afterFix(fixedAt)) return;
        screen = "fix"; render();
        return;
      }

      shelf = rows;
      sortKey = "shelf"; sortDir = 1;
      remember(shelf);
      if (shelf.length === 1 && shelf[0].game) return openGame(shelf[0].game.id);
      screen = "shelf"; render();
    });
  }).catch(function(e){
    if (e && e.message === "PASSWORD") return;   // the password screen is already up
    msg = "<b>Could not read that photo</b>"+esc(e.message||"Something went wrong.");
    msgBad = true; screen = "idle"; render();
  });
}

/* --- corrections --- */
function replaceRowById(i, id){
  busy = "Loading the book"; screen = "busy"; showShot = false; render();
  return loadOne(id).then(function(g){
    if (shelf[i]) shelf[i] = { read:g.name, conf:true, game:g };
    fixTarget = null;
    if (afterFix(i)) return;
    screen = shelf.length ? "fix" : "idle"; render();
  }).catch(function(e){ fail(e); screen = "fix"; render(); });
}
function replaceRow(i, title){
  busy = "Searching Hardcover"; screen = "busy"; render();
  var mm = String(title).match(/^(.*?)\s+by\s+(.+)$/i);
  findId(mm ? mm[1] : title, mm ? mm[2] : "").then(function(id){
    if (!id){ msg = "<b>No match</b>Nothing matched \u201c"+esc(title)+"\u201d.";
      msgBad = true; screen = "fix"; render(); return; }
    return replaceRowById(i, id);
  }).catch(function(e){ fail(e); screen = "fix"; render(); });
}

document.getElementById("gear").onclick = function(){ sheet = true; render(); };
document.getElementById("ver").textContent = "Version " + APP_VERSION;
render();
</script>
