<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelfworthy Books</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shelfworthy Books">
<meta name="theme-color" content="#1F4536">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>

  :root {
    --board:#E9EBE4; --card:#F6F7F3; --ink:#16241E; --pine:#1F4536;
    --ochre:#C6941F; --slate:#55655C; --line:#CFD5CB; --flag:#8C3A2B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--board);color:var(--ink);
    font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased}
  .app{max-width:460px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}

  .top{display:flex;align-items:flex-start;gap:10px}
  .top .who{flex:1;min-width:0}
  h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:26px;color:var(--pine);
    margin:0 0 3px;letter-spacing:-.4px}
  .tag{color:var(--slate);font-size:13.5px;margin:0 0 18px}
  .gear{border:1.5px solid var(--line);background:var(--card);border-radius:9px;
    width:40px;height:40px;flex:none;font-size:17px;color:var(--slate);line-height:1}
  .gear:hover{border-color:var(--pine)}
  .gear.off{border-color:var(--ochre);color:var(--ochre)}

  h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:18px;margin:0 0 3px}
  .hint{color:var(--slate);font-size:13px;margin:0 0 14px}

  button{font-family:inherit;font-size:15px;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2.5px solid var(--ochre);outline-offset:2px}
  .btn{width:100%;border:none;border-radius:10px;background:var(--pine);color:#F6F7F3;
    padding:15px;font-weight:600;margin-top:10px}
  .btn.ghost{background:transparent;color:var(--pine);border:1.5px solid var(--line);padding:13px}
  .btn.ghost:hover{border-color:var(--pine)}

  .row{display:flex;gap:8px}
  .row input{flex:1;padding:13px;font-size:16px;font-family:inherit;border:1.5px solid var(--line);
    border-radius:10px;background:#FFF;color:var(--ink);min-width:0}
  .row button{border:none;background:var(--pine);color:#F6F7F3;border-radius:10px;
    padding:0 18px;font-weight:600}

  #cam{width:100%;border-radius:14px;background:#0D1512;display:block;aspect-ratio:4/3;object-fit:cover}
  .camwrap{position:relative;margin-bottom:12px}
  .reticle{position:absolute;left:12%;right:12%;top:38%;height:24%;
    border:2px solid rgba(246,247,243,.85);border-radius:8px;pointer-events:none}
  .reticle:after{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;
    background:var(--ochre);opacity:.9}

  .pick{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);
    border-radius:10px;padding:13px;margin-bottom:8px;text-decoration:none;color:inherit;width:100%;
    text-align:left;font-size:15px}
  .pick:hover{border-color:var(--pine);background:#FFF}
  .pick .n{flex:1;font-weight:600;min-width:0}
  .pick .go{color:var(--slate);font-size:19px;flex:none}

  .card{background:var(--card);border:1.5px solid var(--pine);border-radius:12px;
    padding:16px;margin-bottom:12px}
  .card .name{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:21px;
    letter-spacing:-.3px;line-height:1.2;text-decoration:none;color:var(--ink);display:block}
  .card .name:hover{color:var(--pine);text-decoration:underline}
  .card .sub{color:var(--slate);font-size:12.5px;margin-top:4px}

  /* the two label lines sit centred against the number, not hanging off its baseline */
  .big{display:flex;align-items:center;gap:11px;margin:12px 0 2px}
  .big .n{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:40px;line-height:1;
    letter-spacing:-1.5px;color:var(--pine);font-variant-numeric:tabular-nums}
  .big .k{font-size:13px;color:var(--slate);line-height:1.35;padding-top:3px}
  .big .k small{font-size:12px;display:block}

  .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:13px;
    background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .fact{background:#FFF;padding:10px 12px;font-size:14px;min-width:0}
  /* labels wrap rather than truncate: a clipped label is worse than two lines */
  /* two lines are reserved whether or not a label wraps, so a wrapping label
     on a narrow phone never makes one row taller than its neighbours */
  .fact k{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.3px;
    color:var(--slate);font-weight:600;margin-bottom:4px;line-height:1.25;
    min-height:25px}
  .fact b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  /* direct child only: the weight dots are also <i>, nested inside .pips */
  .fact b > i{font-style:normal;font-weight:600;color:var(--slate);font-size:12.5px;
    margin-left:4px}
  .fact k s,.fact b s{text-decoration:none;margin:0 3px;color:#9AA79E;font-weight:500}
  .fact b s{margin:0 2px 0 6px}
  .fact .pips{display:inline-flex;margin:0 0 0 7px;vertical-align:1px}

  .pips{display:inline-flex;gap:2.5px;align-items:center;vertical-align:-1px}
  .pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}
  .pips i.f{background:var(--ochre)}

  .sortbar{display:flex;gap:6px;margin-bottom:14px}
  .sortbar button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--slate);
    border-radius:8px;padding:9px;font-size:13px}
  .sortbar button.sel{background:var(--pine);border-color:var(--pine);color:#F6F7F3;font-weight:600}

  .shelfrow{display:flex;gap:11px;align-items:flex-start;background:var(--card);
    border:1.5px solid var(--line);border-radius:10px;padding:13px;margin-bottom:8px}
  .shelfrow .body{flex:1;min-width:0}
  .shelfrow .name{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:16.5px;
    letter-spacing:-.2px;text-decoration:none;color:var(--ink);display:block;line-height:1.2}
  .shelfrow .name:hover{color:var(--pine);text-decoration:underline}
  .shelfrow .sub{color:var(--slate);font-size:12px;margin-top:2px}
  .shelfrow .score{text-align:right;flex:none;width:52px}
  .shelfrow .score .n{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:26px;line-height:1;
    letter-spacing:-1px;color:var(--pine);font-variant-numeric:tabular-nums}
  .shelfrow .score .k{font-size:10.5px;color:var(--slate);margin-top:2px}

  .note{background:var(--card);border:1.5px solid var(--line);border-left:4px solid var(--ochre);
    border-radius:10px;padding:12px;font-size:13.5px;margin-bottom:12px}
  .note b{display:block;margin-bottom:3px}
  .note.bad{border-left-color:var(--flag);background:#F7E9E6;border-color:#D9B5AC}

  .dots{display:inline-flex;gap:6px}
  .dots i{width:9px;height:9px;border-radius:50%;background:var(--pine);animation:p 1.05s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.16s}
  .dots i:nth-child(3){animation-delay:.32s}
  @keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
  .working{text-align:center;padding:36px 0}

  .sheet{position:fixed;inset:0;background:rgba(22,36,30,.55);display:flex;align-items:flex-end;
    justify-content:center;z-index:9}
  .sheet .inner{background:var(--board);border-radius:16px 16px 0 0;padding:20px 16px
    calc(24px + env(safe-area-inset-bottom));width:100%;max-width:460px}
  @media (min-width:520px){ .sheet{align-items:center} .sheet .inner{border-radius:16px} }
  .sheet code{background:#FFF;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px}

  .foot{margin-top:24px;font-size:12px;color:var(--slate);line-height:1.5}
  .foot a{color:var(--slate)}

  
  .scroller{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;
    margin-bottom:12px;border-bottom:1px solid var(--line)}
  .tbl{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
  .tbl thead tr{--rowbg:#DDE2D7}
  .tbl th{position:sticky;top:0;z-index:4;
    font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--pine);
    font-weight:600;text-align:center;padding:10px 0 10px 16px;
    box-shadow:inset 0 -1.5px 0 var(--line);
    white-space:nowrap;cursor:pointer;background:var(--rowbg)}
  .tbl th:hover{background:#CBD3C4}
  .tbl th.on{color:#0F2A20;background:#CBD3C4}
  .tbl th .ar{font-size:9px;margin-left:2px}
  .tbl th:nth-child(1),.tbl td:nth-child(1){position:sticky;left:0;z-index:3;
    text-align:left;padding-left:0;padding-right:0;
    width:24px;min-width:24px;max-width:24px;background:var(--rowbg);text-align:left}
  .tbl th:nth-child(2),.tbl td:nth-child(2){position:sticky;left:24px;z-index:3;
    text-align:left;padding-left:0;padding-right:14px;
    width:184px;min-width:184px;max-width:184px;background:var(--rowbg);text-align:left;
    box-shadow:6px 0 6px -6px rgba(22,36,30,.16)}
  /* first scrolling column needs breathing room past the pinned edge */
  .tbl thead th:nth-child(1),.tbl thead th:nth-child(2){z-index:5}
  .tbl th:nth-child(3),.tbl td:nth-child(3){padding-left:18px}
  .tbl th:nth-child(n+3),.tbl td:nth-child(n+3){min-width:54px}
  .tbl td.r{min-width:58px}
  .tbl td:nth-child(1){color:var(--slate);font-size:12px}
  .tbl th:nth-child(1){padding-left:0}
  .tbl tbody tr{--rowbg:var(--board)}
  .tbl tbody tr:nth-child(even){--rowbg:#DFE3D9}
  .tbl tbody tr:hover{--rowbg:#D6DCD0}
  .tbl td{padding:10px 0 10px 16px;border-bottom:1px solid var(--line);text-align:center;
    color:var(--slate);font-variant-numeric:tabular-nums;white-space:nowrap;
    background:var(--rowbg)}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tr.rw{cursor:pointer}
  .tbl .gm{display:flex;align-items:center;gap:8px;width:100%;min-width:0}
  .tbl .gm .t{font-weight:600;font-size:14px;color:var(--ink);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .tbl tr.rw:hover .t{color:var(--pine);text-decoration:underline}
  .tbl td.r{color:var(--pine);font-weight:700;font-family:Fraunces,Georgia,serif;font-size:16px}
  .tbl tr.miss .t{color:var(--slate);font-weight:500;font-style:italic}

  .thumb{flex:none;width:34px;height:34px;border-radius:5px;display:flex;align-items:center;
    justify-content:center;font-family:Fraunces,Georgia,serif;font-weight:700;color:#FFF;
    font-size:12px;letter-spacing:-.4px;overflow:hidden}
  .thumb.lg{width:104px;height:104px;font-size:30px;border-radius:10px}

  .back{border:none;background:none;color:var(--slate);font-size:13px;padding:4px 0 12px;
    display:inline-flex;align-items:center;gap:5px}
  .back:hover{color:var(--pine)}

  .cardtop{display:flex;gap:15px;align-items:center}
  .card{position:relative}
  .cardtop .who2{min-width:0}
  .cardtop .name{padding-right:58px}
  .fixcorner{position:absolute;top:12px;right:12px;border:1.5px solid var(--line);
    background:var(--board);color:var(--slate);border-radius:999px;padding:6px 10px 6px 8px;
    font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;min-height:34px;
    display:inline-flex;align-items:center;gap:4px}
  .fixcorner svg{width:14px;height:14px}
  .fixcorner:hover{border-color:var(--flag);color:var(--flag)}

  .fact.tap{border:none;text-align:left;cursor:pointer;font-family:inherit;color:inherit;width:100%}
  .fact.tap:hover{background:#FBFCF9}
  .inf{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
    border-radius:50%;border:1.3px solid var(--slate);font-size:9px;font-style:italic;
    font-family:Fraunces,Georgia,serif;font-weight:700;text-decoration:none;margin-left:4px;
    vertical-align:1px;text-transform:none}

  .saysload{display:flex;gap:13px;align-items:center;background:var(--card);
    border:1.5px solid var(--line);border-radius:10px;padding:15px 14px}
  .saysload .dots i{width:7px;height:7px}
  .saysload b{display:block;font-size:14px}
  .saysload small{display:block;font-size:12px;color:var(--slate);margin-top:1px}

  .pop{position:fixed;inset:0;background:rgba(22,36,30,.5);display:flex;align-items:center;
    justify-content:center;padding:18px;z-index:30}
  .popin{background:var(--board);border-radius:16px;padding:20px 18px;max-width:420px;width:100%}
  .popin h3{font-family:Fraunces,Georgia,serif;font-size:19px;margin:0 0 6px}
  .popin p{font-size:13.5px;color:var(--slate);margin:0 0 12px;line-height:1.45}
  .wrow{display:flex;gap:12px;padding:9px 10px;border-radius:8px;margin-bottom:3px}
  .wrow.on{background:#FFF;box-shadow:inset 3px 0 0 var(--ochre)}
  .wr{flex:none;width:62px;font-size:12px;font-weight:600;color:var(--slate);padding-top:1px}
  .wd{flex:1;font-size:13.5px;line-height:1.4}
  .wd small{display:block;font-size:12px;color:var(--slate);margin-top:1px}
  .wthis{margin-top:12px !important;color:var(--ink) !important}
  .cardtop .who2{flex:1;min-width:0}

  /* the last two are prose, not figures, so they read left-aligned */
  .tbl td.ty,.tbl td.mx{font-size:12px;white-space:nowrap;text-align:left}
  .tbl th.hty,.tbl th.hmx{text-align:left}
  .tbl th:last-child,.tbl td:last-child{padding-right:4px}
  .flag{position:absolute;right:-7px;bottom:-7px;width:22px;height:22px;border-radius:50%;
    background:var(--ochre);color:#16241E;font-size:12px;font-weight:700;line-height:1;
    text-align:center;border:2px solid var(--rowbg,var(--board));padding:0;cursor:pointer}
  /* the visible dot stays small; the tap target is a full 44px */
  .flag:after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;
    transform:translate(-50%,-50%)}
  .flag:hover{background:#B0821A}
  .flag.bad{background:var(--flag);color:#F6F7F3}
  .thumbwrap{position:relative;flex:none;display:inline-flex}

  .photoout{display:flex;gap:11px;align-items:center;background:var(--card);
    border:1.5px solid var(--line);border-radius:11px;padding:13px;margin:14px 0 10px}
  .photoout.primary{border-color:var(--pine);background:#FFF}
  .photoout .ic{font-size:21px;flex:none;line-height:1}
  .photoout .tx{flex:1;min-width:0;font-size:13.5px}
  .photoout .tx b{display:block;margin-bottom:2px}
  .photoout .tx small{color:var(--slate);font-size:12px;line-height:1.4;display:block}
  .photoout .pobtn{flex:none;border:1.5px solid var(--pine);background:transparent;
    color:var(--pine);border-radius:8px;padding:12px 14px;font-size:13px;font-weight:600;
    cursor:pointer}
  .photoout.primary .pobtn{background:var(--pine);color:#F6F7F3}
  .photoout button{flex:none;border:1.5px solid var(--pine);background:transparent;
    color:var(--pine);border-radius:8px;padding:11px 14px;font-size:13px;font-weight:600;
    min-height:44px}
  .photoout button:hover{background:var(--pine);color:#F6F7F3}
  .photoout.primary button{background:var(--pine);color:#F6F7F3}

  .term{background:var(--card);border:1.5px solid var(--line);border-radius:10px;
    padding:12px;margin-bottom:7px}
  .term b{display:block;font-family:Fraunces,Georgia,serif;font-size:15px;margin-bottom:3px}
  .term span{font-size:13.5px;color:var(--slate);line-height:1.45}

  .statusbar{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}
  .chip{border:1.5px solid var(--line);background:var(--card);color:var(--slate);
    border-radius:999px;padding:8px 12px;font-size:12.5px;font-weight:600;min-height:38px;
    display:inline-flex;align-items:center;cursor:pointer;font-family:inherit}
  .chip:hover{border-color:var(--pine);color:var(--pine)}
  .chip.warn{border-color:#E0C071;background:#FFF7E4;color:#7A5A10}
  .chip.star{border-color:var(--ochre);color:#7A5A10}

  .starbar{display:flex;align-items:center;gap:10px;background:#FFF7E4;
    border:1.5px solid #E8D49A;border-radius:10px;padding:10px 12px;margin-bottom:12px;
    font-size:13.5px}
  .starbar span{flex:1;color:var(--slate)}
  .starbar b{color:var(--ink)}
  .starbar button{border:1.5px solid var(--pine);background:transparent;color:var(--pine);
    border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;min-height:44px}
  .starbar button:hover{background:var(--pine);color:#F6F7F3}

  .cmptbl th.hg{text-align:center;min-width:112px;padding-bottom:12px}
  .cmptbl .ch{display:flex;flex-direction:column;align-items:center;gap:5px}
  .cmptbl .cn{font-size:12px;font-weight:600;color:var(--ink);text-transform:none;
    letter-spacing:0;line-height:1.25;white-space:normal;max-width:104px}
  .cmptbl td.lb{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--slate);width:96px;min-width:96px;max-width:96px}
  .cmptbl td{font-size:14px;color:var(--ink)}
  .cmptbl td.win{color:var(--pine);font-weight:700}

  /* the table only reports state; you change it on the game's own page */
  .pin{flex:none;font-size:11px;line-height:1;margin-left:5px}
  .pin.star{color:var(--ochre)}
  .pin.own{color:var(--pine)}

  .marks.big{display:flex;gap:8px;margin:13px 0 0;padding-top:13px;flex-wrap:wrap;
    border-top:1px solid var(--line)}
  .marks.big .mk2{flex:1;justify-content:center;min-width:0;white-space:nowrap}
  .marks.big .mk2{border:1.5px solid var(--line);background:var(--card);color:var(--slate);
    border-radius:9px;height:42px;padding:0 15px;font-size:13.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px}
  .marks.big .mk2.star.on{background:var(--ochre);border-color:var(--ochre);color:#16241E}
  .marks.big .mk2.own.on{background:var(--pine);border-color:var(--pine);color:#F6F7F3}

  .price{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
  .ph{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;
    color:var(--slate);margin-bottom:10px}
  .ph span{font-weight:600;color:var(--ink);font-size:13px}
  .bar{position:relative;height:6px;border-radius:3px;background:var(--line);margin:0 0 9px}
  .bar .fill{position:absolute;top:0;bottom:0;border-radius:3px;background:#C3CDBF}
  .bar .dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;
    transform:translate(-50%,-50%)}
  .bar .dot.med{background:var(--pine);border:3px solid var(--card);width:20px;height:20px;
    box-shadow:0 0 0 1px var(--line)}
  .bar .dot.shelf{background:var(--ochre);border:2px solid var(--card);width:15px;height:15px}
  .pl{display:flex;justify-content:space-between;font-size:12px;color:var(--slate);
    font-variant-numeric:tabular-nums}
  .pl b{color:var(--ink)}
  .askprice{display:flex;gap:7px;margin-top:11px}
  .askprice input{flex:1;min-width:0;padding:10px;font-size:15px;font-family:inherit;
    border:1.5px solid var(--line);border-radius:8px;background:#FFF;color:var(--ink)}
  .askprice button{flex:none;border:1.5px solid var(--pine);background:transparent;
    color:var(--pine);border-radius:8px;padding:0 15px;font-size:13.5px;font-weight:600;
    min-height:44px}
  .askprice button:hover{background:var(--pine);color:#F6F7F3}

  .shelfrow2{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;
    color:var(--slate)}
  .shelfrow2 b{color:var(--ink);font-variant-numeric:tabular-nums}
  .verdict{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--slate)}
  .verdict.good{color:var(--pine)}
  .verdict.bad{color:var(--flag)}

  .hist{margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}

    Book data and reviews from <a href="https://hardcover.app" target="_blank" rel="noopener">Hardcover</a>.
    Review summaries by Gemini, with the original review one tap away.

  </div>
</div>

<script id="core">
/* ======================= book logic (pure) =======================
   No page or network access in here, so it can be tested on its own.     */

var RATING_MIN = 10;   // fewer ratings than this and the average means little

/* ---------- ISBN ---------- */
function isbnDigits(s){ return String(s || "").replace(/[\s-]/g, "").toUpperCase(); }
function validIsbn13(s){
  if (!/^\d{13}$/.test(s)) return false;
  var sum = 0; for (var i = 0; i < 13; i++) sum += +s[i] * (i % 2 ? 3 : 1);
  return sum % 10 === 0;
}
function validIsbn10(s){
  if (!/^\d{9}[\dX]$/.test(s)) return false;
  var sum = 0; for (var i = 0; i < 10; i++) sum += (s[i] === "X" ? 10 : +s[i]) * (10 - i);
  return sum % 11 === 0;
}
function isbn10to13(s){
  var core = "978" + s.slice(0, 9), sum = 0;
  for (var i = 0; i < 12; i++) sum += +core[i] * (i % 2 ? 3 : 1);
  return core + ((10 - (sum % 10)) % 10);
}
/** What a scanned or typed code is. Books carry an ISBN-13 starting 978 or 979;
    mass-market paperbacks sometimes show a store UPC on the back instead. */
function classifyCode(raw){
  var d = isbnDigits(raw);
  if (/^97[89]\d{10}$/.test(d)) return validIsbn13(d) ? { kind: "isbn", isbn13: d, isbn10: null } : { kind: "bad" };
  if (/^\d{9}[\dX]$/.test(d)) return validIsbn10(d) ? { kind: "isbn", isbn13: isbn10to13(d), isbn10: d } : { kind: "bad" };
  if (/^\d{12,13}$/.test(d)) return { kind: "upc" };
  if (/^\d{5}$/.test(d)) return { kind: "addon" };       // the little price code beside the ISBN
  return { kind: "other" };
}

/* ---------- matching a read title to the right book ---------- */
function normTitle(s){
  return String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/&/g, " and ")
    .replace(/[:(].*$/, "")                 // drop subtitle or "(Series, #2)"
    .replace(/^(the|a|an)\s+/, "")
    .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
}
function editWithin1(a, b){
  if (Math.abs(a.length - b.length) > 1) return false;
  var i = 0, j = 0, diff = 0;
  while (i < a.length && j < b.length){
    if (a[i] === b[j]){ i++; j++; continue; }
    if (++diff > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return diff + (a.length - i) + (b.length - j) <= 1;
}
/** Whole title as words, keeping text after a colon ("Star Wars: Heir to the Empire"),
    dropping only a trailing "(Series, #1)" and a leading article. */
function titleWords(s){
  var t = String(s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
    .replace(/&/g, " and ").replace(/\s*\([^)]*\)\s*$/, "")
    .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim().replace(/^(the|a|an)\s+/, "");
  return t ? t.split(" ").filter(function(w, i, a){ return a.indexOf(w) === i; }) : [];
}
function sameWord(w, x){ return w === x || (w.length >= 4 && x.length >= 4 && editWithin1(w, x)); }
/** A title and its pieces: the whole thing, plus the parts either side of a subtitle break
    (colon, ", or", or a dash). "Star Wars: Heir to the Empire" -> whole, "star wars", "heir to the empire". */
function titleParts(s){
  var raw = String(s || "").replace(/\s*\([^)]*\)\s*$/, "");
  var whole = titleWords(raw).join(" ");
  var parts = raw.split(/:|,\s+or\s+|\s+[-\u2013\u2014]\s+/i).map(function(x){ return titleWords(x).join(" "); })
    .filter(Boolean);
  return { whole: whole, parts: parts };
}
/** Titles match when they're the same, when one is just the other minus a subtitle
    ("Dune" / "Dune: Deluxe Edition", "Heir to the Empire" / "Star Wars: Heir to the Empire",
    "The Hobbit" / "The Hobbit, or There and Back Again"), or when most words are shared,
    allowing one-letter typos ("harry poter"). Extra title words are NOT a subtitle:
    "Dune" does not match "Dune Messiah". */
function titleMatches(query, found){
  var A = titleParts(query), B = titleParts(found);
  if (!A.whole || !B.whole) return false;
  if (A.whole === B.whole || B.parts.indexOf(A.whole) >= 0 || A.parts.indexOf(B.whole) >= 0) return true;
  var a = titleWords(query.replace(/\s*\([^)]*\)\s*$/, "")), b = titleWords(String(found).replace(/\s*\([^)]*\)\s*$/, ""));
  var common = a.filter(function(w){ return b.some(function(x){ return sameWord(w, x); }); }).length;
  return common / Math.max(a.length, b.length) >= 0.55;
}
/** true / false / null (unknown). Any 3+ letter word typed or read appears in the author. */
function authorMatches(query, found){
  if (!query) return true;
  if (!found) return null;
  var f = String(found).toLowerCase();
  return String(query).toLowerCase().split(/[^a-z]+/).some(function(w){ return w.length >= 3 && f.indexOf(w) >= 0; });
}
var JUNK_RE = /\b(summary|summaries|study guide|notebook|journal|workbook|analysis|sparknotes|cliffsnotes|box set|boxed set|collection set|books? collection|\d+ books? set|coloring book)\b/i;
function isJunk(asked, title){ return JUNK_RE.test(title || "") && !JUNK_RE.test(asked || ""); }

/** From search candidates, the real book: title must match, author must not
    contradict, no study guides, and among those the one most people rated. */
function pickMatching(q, list){
  var found = (list || []).filter(function(r){ return r && r.id != null; });
  if (!found.length) return null;
  var scored = found.map(function(r, i){
    var t = titleMatches(q.title, r.title) || (q.raw ? titleMatches(q.raw, r.title) : false);
    var a = authorMatches(q.author, r.author);
    var tier = !t || isJunk(q.raw || q.title, r.title) || a === false ? 0 : a === true ? 2 : 1;
    return { r: r, tier: tier, i: i };
  });
  var good = scored.filter(function(x){ return x.tier > 0; }).sort(function(x, y){
    return y.tier - x.tier || (y.r.count || 0) - (x.r.count || 0) || x.i - y.i; });
  return good.length ? { id: String(good[0].r.id), ok: true, title: good[0].r.title || "" }
                     : { id: String(found[0].id), ok: false, title: found[0].title || "" };
}

/* ---------- Hardcover queries (each top-level field costs one rate-limit token) ---------- */
function gqlStr(s){ return JSON.stringify(String(s)); }
function hcSearchQ(text){
  return 'query { search(query: ' + gqlStr(text) + ', query_type: "Book", per_page: 10, page: 1) { results } }';
}
function hcIsbnQ(isbn13, isbn10){
  var conds = ['{isbn_13: {_eq: ' + gqlStr(isbn13) + '}}'];
  if (isbn10) conds.push('{isbn_10: {_eq: ' + gqlStr(isbn10) + '}}');
  return 'query { editions(where: {_or: [' + conds.join(", ") + ']}, limit: 1) { book_id } }';
}
var BOOK_FIELDS = "id title slug rating ratings_count reviews_count pages release_year cached_contributors cached_tags image { url }";
function hcBooksQ(ids){
  return 'query { books(where: {id: {_in: [' + ids.map(function(i){ return +i; }).join(", ") + ']}}) { ' + BOOK_FIELDS + ' } }';
}
function hcDetailQ(id){
  return 'query { books(where: {id: {_eq: ' + (+id) + '}}) { ' + BOOK_FIELDS + ' } ' +
    'user_books(where: {book_id: {_eq: ' + (+id) + '}, has_review: {_eq: true}, privacy_setting_id: {_eq: 1}}, ' +
    'order_by: {likes_count: desc}, limit: 40) { rating review_raw review_has_spoilers user { username } } }';
}

/* ---------- reading Hardcover answers ---------- */
function searchHits(json){
  var res = json && json.data && json.data.search && json.data.search.results;
  if (typeof res === "string"){ try { res = JSON.parse(res); } catch (e){ res = null; } }
  return ((res && res.hits) || []).map(function(h){ return h && h.document; }).filter(Boolean).map(function(d){
    return { id: d.id, title: d.title, author: Array.isArray(d.author_names) ? d.author_names.slice(0, 2).join(", ") : null,
      count: d.ratings_count || 0, genres: Array.isArray(d.genres) ? d.genres.slice(0, 2) : [] };
  });
}
function authorFrom(c){
  try {
    var arr = typeof c === "string" ? JSON.parse(c) : c;
    var names = (arr || []).map(function(x){ return x && x.author && x.author.name; }).filter(Boolean);
    return names.length ? names.slice(0, 2).join(", ") : "";
  } catch (e){ return ""; }
}
/** cached_tags is a JSON object of tag groups. Shape is not documented, so read it gently. */
function genreFrom(t){
  try {
    var o = typeof t === "string" ? JSON.parse(t) : t;
    if (!o || typeof o !== "object") return "";
    var key = Object.keys(o).filter(function(k){ return /genre/i.test(k); })[0];
    var list = key ? o[key] : null;
    if (!Array.isArray(list) || !list.length) return "";
    var first = list[0];
    return String((first && (first.tag || first.name)) || (typeof first === "string" ? first : "")).trim();
  } catch (e){ return ""; }
}
function parseBook(b){
  var avg = b.rating == null ? null : Math.round(parseFloat(b.rating) * 100) / 100;
  return {
    id: String(b.id), name: b.title || "Unknown book", slug: b.slug || "",
    author: authorFrom(b.cached_contributors), year: b.release_year || null,
    avg: isFinite(avg) && avg > 0 ? avg : null, users: b.ratings_count || 0,
    reviews: b.reviews_count || 0, pages: b.pages || null,
    genre: genreFrom(b.cached_tags), thumb: (b.image && b.image.url) || "",
    comments: []
  };
}
function thinRating(g){ return !g || !g.avg || (g.users || 0) < RATING_MIN; }

/* ---------- reviews worth summarising ---------- */
var EN_WORDS = /\b(the|and|was|this|that|with|for|but|book|story|it's|is|of|to|i|my|read)\b/gi;
function looksEnglish(t){
  var words = String(t).split(/\s+/).filter(Boolean).length;
  var hits = (String(t).match(EN_WORDS) || []).length;
  return words > 0 && hits / words >= 0.12;
}
function cleanText(t){
  return String(t || "").replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&")
    .replace(/\s+/g, " ").trim();
}
/** Drops spoilers, non-English, one-liners, and reviews that are only a quote from the book. */
function pickReviews(userBooks){
  return (userBooks || []).filter(function(u){ return u && !u.review_has_spoilers; }).map(function(u){
    return { who: (u.user && u.user.username) || "a reader", rating: u.rating, text: cleanText(u.review_raw) };
  }).filter(function(c){
    if (c.text.length < 60 || c.text.length > 1500) return false;
    if (/^["“][^"”]+["”]\s*$/.test(c.text)) return false;
    return looksEnglish(c.text);
  }).slice(0, 25);
}

/* ---------- links ---------- */
function bookURL(g){ return g && g.slug ? "https://hardcover.app/books/" + encodeURIComponent(g.slug) : "https://hardcover.app"; }
function reviewsURL(g){ return g && g.slug ? bookURL(g) + "/reviews" : bookURL(g); }
function priceLinks(g){
  var q = encodeURIComponent((g.name + " " + (g.author || "").split(",")[0]).trim());
  return [
    ["Bookshop", "https://bookshop.org/search?keywords=" + q],
    ["Amazon", "https://www.amazon.com/s?i=stripbooks&k=" + q],
    ["Used prices", "https://www.bookfinder.com/search/?keywords=" + q + "&mode=basic&st=sr&ac=qr"]
  ];
}

/* ---------- Goodreads import: which books you've read ---------- */
function parseCsv(text){
  var rows = [], row = [], f = "", q = false;
  for (var i = 0; i < text.length; i++){
    var c = text[i];
    if (q){
      if (c === '"'){ if (text[i + 1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(f); f = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = [];
    } else f += c;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function lastName(author){
  var first = String(author || "").split(",")[0].trim().split(/\s+/);
  return first.length ? first[first.length - 1].toLowerCase().replace(/[^a-z]/g, "") : "";
}
function readKey(title, author){ return normTitle(title) + "|" + lastName(author); }

/** Goodreads export -> { "normtitle|lastname": {t, a, r} } for every book on the "read" shelf. */
function parseGoodreads(text){
  var rows = parseCsv(String(text).replace(/^﻿/, ""));
  if (!rows.length) throw new Error("That file is empty.");
  var h = rows[0].map(function(x){ return x.trim(); });
  var iT = h.indexOf("Title"), iA = h.indexOf("Author"), iR = h.indexOf("My Rating"), iE = h.indexOf("Exclusive Shelf");
  if (iT < 0 || iA < 0) throw new Error("That doesn't look like a Goodreads export.");
  var out = {}, n = 0;
  rows.slice(1).forEach(function(r){
    if (!r[iT]) return;
    if (iE >= 0 && String(r[iE]).trim() !== "read") return;
    var rating = iR >= 0 ? parseInt(r[iR], 10) || 0 : 0;
    out[readKey(r[iT], r[iA])] = { t: r[iT].trim(), a: (r[iA] || "").trim(), r: rating };
    n++;
  });
  return { books: out, n: n };
}
/** Read in the app (by id) wins; otherwise a Goodreads title+author match. */
function readStatus(g, READ, GR){
  if (!g) return null;
  if (READ && READ[g.id]) return { read: true, rating: READ[g.id].r || 0, src: "app" };
  var hit = GR && GR[readKey(g.name, g.author)];
  return hit ? { read: true, rating: hit.r || 0, src: "goodreads" } : null;
}

/* ---------- Libby (audiobook availability) ---------- */
var LIBBY_LOAN_DAYS = 14;   // Libby's usual audiobook loan
function libbyPath(libKey, g){
  var q = g.name.split(":")[0] + " " + lastName(g.author);
  return "libraries/" + encodeURIComponent(libKey) + "/media?query=" + encodeURIComponent(q.trim()) +
    "&format=audiobook-overdrive,audiobook-mp3&perPage=20";
}
function isEnglish(item){
  var l = item && item.languages;
  if (!Array.isArray(l) || !l.length) return true;          // not stated: assume English
  return l.some(function(x){ return x && (x.id === "en" || /^english$/i.test(x.name || "")); });
}
/** The library's copy of this book: English, same title, author doesn't contradict,
    not a summary or study guide sold under the same title, and the one with most copies. */
function pickLibbyItem(g, items){
  var asked = g.name + " by " + (g.author || "");
  var ok = (items || []).filter(function(it){
    if (!it || !it.id || !it.title) return false;
    if (!isEnglish(it)) return false;
    if (!titleMatches(g.name, it.title)) return false;
    if (authorMatches(lastName(g.author), it.firstCreatorName) === false) return false;
    var label = it.title + " " + (it.subtitle || "") + " " + (it.edition || "");
    if (isJunk(asked, label) || /\b(abridged|summary of|a novel by .* summary)\b/i.test(label)) return false;
    return true;
  });
  if (!ok.length) return null;
  var exact = function(it){ return titleWords(it.title).join(" ") === titleWords(g.name).join(" ") ? 1 : 0; };
  ok.sort(function(a, b){ return exact(b) - exact(a) || (b.ownedCopies || 0) - (a.ownedCopies || 0); });
  return ok[0];
}
/** -> { state: "now" | "wait" | "none", avail, owned, holds, weeks, id } */
function libbyStatus(item){
  if (!item) return { state: "none" };
  var owned = item.ownedCopies || 0, avail = item.availableCopies || 0, holds = item.holdsCount || 0;
  var lucky = item.luckyDayAvailableCopies || 0;
  if (item.isAvailable || avail > 0 || lucky > 0)
    return { state: "now", avail: Math.max(avail, lucky), owned: owned, holds: 0, id: String(item.id), lucky: !avail && lucky > 0 };
  if (!owned && !holds) return { state: "none" };
  var weeks = Math.max(1, Math.round((holds + 1) / Math.max(owned, 1) * LIBBY_LOAN_DAYS / 7));
  return { state: "wait", avail: 0, owned: owned, holds: holds, weeks: weeks, id: String(item.id) };
}
function waitText(st){
  if (!st || st.state === "none") return "Not on Libby";
  if (st.state === "now") return st.lucky ? "Lucky Day copy" : "Borrow now";
  return st.weeks > 26 ? "6+ months" : "about " + st.weeks + " wk";
}
/** Best across your libraries: available now beats any wait; shorter wait beats longer. */
function bestLibby(statuses){
  var list = (statuses || []).filter(Boolean);
  var rank = function(s){ return s.state === "now" ? 0 : s.state === "wait" ? s.weeks : 9999; };
  list.sort(function(a, b){ return rank(a) - rank(b); });
  return list[0] || null;
}
function libbyLink(st){ return st && st.id ? "https://share.libbyapp.com/title/" + encodeURIComponent(st.id) : "https://libbyapp.com"; }
/** Search the saved library list by name or code. Starts-with beats contains. */
function searchLibraries(list, q, max){
  q = String(q || "").toLowerCase().trim();
  if (q.length < 2) return [];
  var words = q.split(/\s+/);
  var hits = [];
  (list || []).forEach(function(l){
    var name = String(l[1]).toLowerCase(), key = String(l[0]).toLowerCase();
    if (!words.every(function(w){ return name.indexOf(w) >= 0 || key.indexOf(w) >= 0; })) return;
    var score = key === q ? 0 : name.indexOf(q) === 0 ? 1 : (" " + name).indexOf(" " + words[0]) >= 0 ? 2 : 3;
    hits.push([score, l]);
  });
  hits.sort(function(a, b){ return a[0] - b[0] || a[1][1].localeCompare(b[1][1]); });
  return hits.slice(0, max || 8).map(function(h){ return { key: h[1][0], name: h[1][1] }; });
}
function cleanLibCode(s){
  var m = String(s || "").trim().toLowerCase().match(/^(?:https?:\/\/)?(?:www\.)?(?:libbyapp\.com\/library\/)?([a-z0-9._-]+?)(?:\.overdrive\.com)?(?:[\/?#].*)?$/);
  return m ? m[1] : "";
}

/* ---------- Open Library: title and author for an ISBN Hardcover doesn't know ---------- */
function olIsbnURL(isbn13){ return "https://openlibrary.org/search.json?q=isbn:" + encodeURIComponent(isbn13) + "&fields=title,author_name&limit=1"; }
function olFromSearch(json){
  var d = json && json.docs && json.docs[0];
  if (!d || !d.title) return null;
  return { title: String(d.title).trim(), author: ((d.author_name || [])[0] || "").trim() };
}

/* ---------- book page helpers ---------- */
/** "Loudoun County Public Library" -> "Loudoun". Keeps the original if nothing would be left. */
function shortLibName(name){
  var n = String(name || "").replace(/\b(county|public|library|libraries|district|system|regional|free)\b/gi, " ")
    .replace(/\s+/g, " ").replace(/^[\s,&-]+|[\s,&-]+$/g, "").trim();
  return n || String(name || "");
}
/** Libby rows in order of usefulness: available now (most copies free first), then shortest wait;
    libraries that errored or don't have it are listed separately. */
function sortLibby(per){
  var now = [], wait = [], err = [], none = [];
  (per || []).forEach(function(x){
    if (x.err) err.push(x);
    else if (!x.st || x.st.state === "none") none.push(x);
    else if (x.st.state === "now") now.push(x);
    else wait.push(x);
  });
  now.sort(function(a, b){ return (b.st.avail || 0) - (a.st.avail || 0); });
  wait.sort(function(a, b){ return a.st.weeks - b.st.weeks; });
  return { rows: now.concat(wait), err: err, none: none };
}
/** The single strongest praise and criticism, for the verdict strip. */
function topSays(says){
  var best = function(dir){ return (says || []).filter(function(s){ return s.dir === dir; })
    .sort(function(a, b){ return (b.n || 0) - (a.n || 0); })[0] || null; };
  return { up: best("up"), down: best("down") };
}
/** Fill width for the gold stars: 4.5 -> 90 (%). */
function starPct(avg){ return Math.max(0, Math.min(100, Math.round((avg || 0) / 5 * 100))); }

if (typeof module !== "undefined") module.exports = {
  RATING_MIN: RATING_MIN, isbnDigits: isbnDigits, validIsbn13: validIsbn13, validIsbn10: validIsbn10, isbn10to13: isbn10to13,
  classifyCode: classifyCode, normTitle: normTitle, editWithin1: editWithin1, titleMatches: titleMatches, titleWords: titleWords,
  authorMatches: authorMatches, isJunk: isJunk, pickMatching: pickMatching, hcSearchQ: hcSearchQ, hcIsbnQ: hcIsbnQ,
  hcBooksQ: hcBooksQ, hcDetailQ: hcDetailQ, searchHits: searchHits, authorFrom: authorFrom, genreFrom: genreFrom,
  parseBook: parseBook, thinRating: thinRating, looksEnglish: looksEnglish, cleanText: cleanText, pickReviews: pickReviews,
  bookURL: bookURL, reviewsURL: reviewsURL, priceLinks: priceLinks, parseCsv: parseCsv, lastName: lastName, readKey: readKey,
  parseGoodreads: parseGoodreads, readStatus: readStatus,
  libbyPath: libbyPath, isEnglish: isEnglish, pickLibbyItem: pickLibbyItem, libbyStatus: libbyStatus, waitText: waitText,
  bestLibby: bestLibby, libbyLink: libbyLink, searchLibraries: searchLibraries, cleanLibCode: cleanLibCode,
  olIsbnURL: olIsbnURL, olFromSearch: olFromSearch,
  shortLibName: shortLibName, sortLibby: sortLibby, topSays: topSays, starPct: starPct
};

/* ============================ storage =========================== */
function ls(k, v){
  try {
    if (v === undefined) return localStorage.getItem(k) || "";
    v ? localStorage.setItem(k, v) : localStorage.removeItem(k);
  } catch(e){ return ""; }
}
function lsJSON(k){ try { return JSON.parse(ls(k) || "{}"); } catch(e){ return {}; } }
function saveJSON(k, o){ ls(k, JSON.stringify(o)); }

function token(){ return "proxy"; }    // the server holds it now

// Must match norm() in scripts/build_cache.py exactly, or nothing will match.
function norm(s){
  s = String(s).normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
  s = s.toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ");
  return s.replace(/\s+/g, " ").trim();
}

/* ---------------------------- history -------------------------------
   Keeps what was found, not the photos. Enough to reopen a shelf later
   without re-photographing it.                                          */
var HISTORY = (function(){
  try { var h = JSON.parse(ls(K_HIST) || "[]"); return h.length ? h : []; }
  catch(e){ return []; }
})();

function remember(rows){
  var found = rows.filter(function(r){ return r.game; });
  if (!found.length) return;
  var entry = {
    t: Date.now(),
    ids: found.map(function(r){ return String(r.game.id); }),
    names: found.map(function(r){ return r.game.name; }),
    missed: rows.length - found.length
  };
  // Re-scanning the same shelf should replace the old entry, not stack up.
  var key = entry.ids.slice().sort().join(",");
  HISTORY = HISTORY.filter(function(h){
    return (h.ids || []).slice().sort().join(",") !== key; });
  HISTORY.unshift(entry);
  HISTORY = HISTORY.slice(0, 40);
  try { ls(K_HIST, JSON.stringify(HISTORY)); } catch(e){}
}

function rememberOne(g){ remember([{ game: g }]); }

function forgetAll(){
  HISTORY = []; try { ls(K_HIST, ""); } catch(e){}
}

function whenText(ms){
  var mins = Math.round((Date.now() - ms) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  var hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
  var days = Math.round(hrs / 24);
  if (days < 7) return days + (days === 1 ? " day ago" : " days ago");
  return new Date(ms).toLocaleDateString();
}

function histLabel(h){
  if (h.ids.length === 1) return esc(h.names[0]);
  return esc(h.names.slice(0, 3).join(", ")) +
    (h.names.length > 3 ? " and " + (h.names.length - 3) + " more" : "");
}

function histRow(h, i){
  return '<button class="hrow" data-hist="'+i+'">'+
    '<span class="hn">'+(h.ids.length === 1 ? "1 book" : h.ids.length + " books")+'</span>'+
    '<span class="hb"><span class="ht">'+histLabel(h)+'</span>'+
    '<span class="hw">'+esc(whenText(h.t))+
      (h.missed ? " &middot; " + h.missed + " unmatched" : "")+'</span></span>'+
    '<span class="go">&rarr;</span></button>';
}

/* ========================= saved lookups ========================
   Past lookups are kept on the phone (in IndexedDB, which has far more room
   than the small storage the title cache already uses) so opening the same
   thing again needs no network. Shared by the games and books pages; keys
   start with "g:" or "b:". If the browser blocks it, everything still works,
   just without the shortcut.                                               */
var LC = (function(){
  var DB = "shelfworthy-lookups", ST = "kv", dbp = null;
  function db(){
    if (dbp) return dbp;
    dbp = new Promise(function(res){
      try {
        var r = indexedDB.open(DB, 1);
        r.onupgradeneeded = function(){ r.result.createObjectStore(ST); };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = r.onblocked = function(){ res(null); };
      } catch(e){ res(null); }
      setTimeout(function(){ res(null); }, 1500);      // never let storage hold up a lookup
    });
    return dbp;
  }
  function req(mode, fn){
    return db().then(function(d){
      if (!d) return null;
      return new Promise(function(res){
        try {
          var q = fn(d.transaction(ST, mode).objectStore(ST));
          q.onsuccess = function(){ res(q.result); };
          q.onerror = function(){ res(null); };
        } catch(e){ res(null); }
      });
    });
  }
  function eachKey(test){
    return db().then(function(d){
      if (!d) return 0;
      return new Promise(function(res){
        var n = 0;
        try {
          var c = d.transaction(ST, "readwrite").objectStore(ST).openCursor();
          c.onsuccess = function(){
            var cur = c.result;
            if (!cur){ res(n); return; }
            if (test(String(cur.key), cur.value)){ cur.delete(); n++; }
            cur.continue();
          };
          c.onerror = function(){ res(n); };
        } catch(e){ res(n); }
      });
    });
  }
  return {
    /** The saved value if younger than maxAge (ms), else null. */
    get: function(k, maxAge){
      return req("readonly", function(s){ return s.get(k); }).then(function(v){
        return v && Date.now() - v.t < maxAge ? v.v : null;
      });
    },
    set: function(k, v){ return req("readwrite", function(s){ return s.put({ v: v, t: Date.now() }, k); }); },
    /** Remove every key starting with prefix. Resolves to how many went. */
    clear: function(prefix){ return eachKey(function(k){ return k.indexOf(prefix) === 0; }); },
    /** Drop anything not touched for maxAge, so the store never grows forever. */
    prune: function(maxAge){ return eachKey(function(k, v){ return !v || Date.now() - v.t > maxAge; }); }
  };
})();
var DAY = 864e5;
setTimeout(function(){ LC.prune(60 * DAY); }, 4000);
function lcKey(s){ return String(s || "").toLowerCase().replace(/\s+/g, " ").trim(); }
/** A copy safe to save: no review text (large, and only needed until summarised). */
function lean(g){
  var o = {}; for (var k in g) if (k !== "comments" && k !== "says" && k !== "saysState" && k !== "conf") o[k] = g[k];
  o.nComments = (g.comments || []).length;
  return o;
}

/* ========================== Hardcover =========================== */
// Free tier: bursts of 10 calls, then about 1 a second. The Worker caches
// answers for a day, so repeat books cost nothing. A 429 means wait and retry.
var HC_ACTIVE = 0, HC_QUEUE = [];
function hcSlot(){
  return new Promise(function(res){
    var go = function(){ HC_ACTIVE++; res(); };
    if (HC_ACTIVE < 4) go(); else HC_QUEUE.push(go);
  });
}
function hcDone(){ HC_ACTIVE--; var n = HC_QUEUE.shift(); if (n) n(); }

function hcFetch(query, tries){
  tries = tries || 0;
  return hcSlot().then(function(){
    return fetch(HC, { method: "POST", headers: proxyHeaders({ "Content-Type": "application/json" }),
                       body: JSON.stringify({ query: query }) });
  }).then(function(r){
    hcDone();
    if (r.status === 403){ askPassword(true); throw new Error("PASSWORD"); }
    if (r.status === 429 && tries < 4){
      var wait = Math.min(15, parseInt(r.headers.get("Retry-After"), 10) || 2);
      busyNote = "Hardcover asked us to slow down, waiting " + wait + "s\u2026";
      if (screen === "busy") render();
      return sleep(wait * 1000).then(function(){ return hcFetch(query, tries + 1); });
    }
    return r.json().catch(function(){ return {}; }).then(function(d){
      if (!r.ok) throw new Error(r.status === 500 && /HARDCOVER_TOKEN/.test(JSON.stringify(d))
        ? "The shared server is missing its Hardcover token."
        : "Hardcover did not answer (" + r.status + "). Try again in a moment.");
      if (d.errors && d.errors.length) throw new Error("Hardcover: " + (d.errors[0].message || "query failed"));
      busyNote = "";
      return d.data || {};
    });
  }, function(e){ hcDone(); throw e; });
}

function loadMany(ids){
  ids = ids.filter(function(x, i, a){ return x && a.indexOf(x) === i; });
  if (!ids.length) return Promise.resolve({});
  var out = {};
  // Saved books come straight from the phone; only the rest go to Hardcover.
  return Promise.all(ids.map(function(id){
    return LC.get("b:book:" + id, 7 * DAY).then(function(v){ if (v){ v.comments = []; out[id] = v; } });
  })).then(function(){
    var need = ids.filter(function(id){ return !out[id]; });
    if (!need.length) return out;
    return hcFetch(hcBooksQ(need)).then(function(d){
      (d.books || []).forEach(function(b){ var g = parseBook(b); out[g.id] = g; LC.set("b:book:" + g.id, lean(g)); });
      return out;
    });
  });
}
function loadOne(id){
  // The full page needs reviews only to summarise them. If the summary is saved
  // (or there are no reviews), the saved book is all we need.
  var said = saysCache()[id], fresh = said && Date.now() - said.t < 30 * DAY;
  return LC.get("b:book:" + id, 7 * DAY).then(function(v){
    if (v && v.full && (fresh || !v.nComments)){
      v.comments = []; if (fresh && said.s && said.s.length) v.says = said.s;
      return v;
    }
    return hcFetch(hcDetailQ(id)).then(function(d){
      var b = (d.books || [])[0];
      if (!b) throw new Error("That book was not found on Hardcover.");
      var g = parseBook(b);
      g.comments = pickReviews(d.user_books);
      var keep = lean(g); keep.full = true; LC.set("b:book:" + g.id, keep);
      return g;
    });
  });
}
/** A title (and author, if known) to { id, ok }. ok=false means "closest guess, check it". */
function findMatch(title, author){
  var key = "b:q:" + lcKey(title) + "|" + lcKey(author);
  return LC.get(key, 30 * DAY).then(function(hit){
    if (hit) return hit;
    return findMatchLive(title, author).then(function(m){ if (m) LC.set(key, m); return m; });
  });
}
function findMatchLive(title, author){
  var q = { title: title, author: author || null, raw: author ? title + " by " + author : title };
  return hcFetch(hcSearchQ(title)).then(function(d){
    var m = pickMatching(q, searchHits({ data: d }));
    if (m && m.ok) return m;
    if (!author) return m;
    // A wrong read of title vs author: try everything together before giving up.
    return hcFetch(hcSearchQ(title + " " + author)).then(function(d2){
      var m2 = pickMatching(q, searchHits({ data: d2 }));
      return (m2 && (m2.ok || !m)) ? m2 : m;
    });
  }).catch(function(e){ if (e && e.message === "PASSWORD") throw e; return null; });
}
function findId(title, author){
  return findMatch(title, author).then(function(m){ return m ? m.id : null; });
}
function findIsbn(isbn13, isbn10){
  var key = "b:isbn:" + isbn13;
  return LC.get(key, 30 * DAY).then(function(hit){
    if (hit) return hit;
    return hcFetch(hcIsbnQ(isbn13, isbn10)).then(function(d){
      var e = (d.editions || [])[0];
      var id = e && e.book_id ? String(e.book_id) : null;
      if (id) LC.set(key, id);
      return id;
    });
  });
}

var LIBBY = {};              // book id -> { state: "loading"|"done", per: [{ lib, st, err }] }
var LB_ACTIVE = 0, LB_QUEUE = [];
function libbyGet(path){
  return new Promise(function(res){
    var go = function(){ LB_ACTIVE++; res(); };
    if (LB_ACTIVE < 4) go(); else LB_QUEUE.push(go);
  }).then(function(){
    return fetch(PROXY + "/libby/" + path, { headers: proxyHeaders() });
  }).then(function(r){
    LB_ACTIVE--; var n = LB_QUEUE.shift(); if (n) n();
    if (r.status === 403){ askPassword(true); throw new Error("PASSWORD"); }
    if (!r.ok) throw new Error("Libby did not answer (" + r.status + ")");
    return r.json();
  }, function(e){ LB_ACTIVE--; var n = LB_QUEUE.shift(); if (n) n(); throw e; });
}
function loadLibby(g){
  var libs = myLibs();
  if (!g || !libs.length) return null;
  if (LIBBY[g.id]) return LIBBY[g.id];
  var entry = LIBBY[g.id] = { state: "loading", per: [] };
  Promise.all(libs.map(function(l){
    var key = "b:libby:" + l.key + ":" + g.id;
    return LC.get(key, 3600e3).then(function(saved){
      if (saved) return { lib: l, st: saved.st };
      return libbyGet(libbyPath(l.key, g)).then(function(d){
        var st = libbyStatus(pickLibbyItem(g, d && d.items));
        LC.set(key, { st: st });
        return { lib: l, st: st };
      });
    })
      .catch(function(e){ return { lib: l, st: null, err: !(e && e.message === "PASSWORD") }; });
  })).then(function(per){
    if (LIBBY[g.id] !== entry) return;           // libraries changed meanwhile
    entry.state = "done"; entry.per = per; renderSoon();
  });
  return entry;
}

/* ============================ Gemini ============================ */
function toB64(file){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ res(String(r.result).split(",")[1]); };
    r.onerror = function(){ rej(new Error("Could not read that photo.")); };
    r.readAsDataURL(file);
  });
}

// A phone photo is often 3 to 8 MB. Box titles are legible at a fraction of
// that, and a small image uploads faster on store signal and reads faster too.
var MAX_EDGE = 1600, JPEG_Q = 0.82;

function shrinkPhoto(file){
  var fallback = function(){
    return toB64(file).then(function(b){ return { b64: b, type: file.type || "image/jpeg" }; });
  };
  var probe = typeof document !== "undefined" && document.createElement("canvas");
  if (!probe || !probe.getContext || !probe.getContext("2d")) return fallback();

  var decode = (typeof createImageBitmap === "function")
    ? createImageBitmap(file)
    : new Promise(function(res, rej){
        var im = new Image();
        im.onload = function(){ res(im); };
        im.onerror = rej;
        im.src = URL.createObjectURL(file);
      });
  // If decoding stalls, send the original rather than leaving the spinner up.
  var load = Promise.race([decode, new Promise(function(_, rej){
    setTimeout(function(){ rej(new Error("decode timeout")); }, 4000); })]);

  return load.then(function(img){
    var w = img.width, h = img.height;
    if (!w || !h) return fallback();
    var k = Math.min(1, MAX_EDGE / Math.max(w, h));
    var c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    var ctx = c.getContext("2d");
    if (!ctx) return fallback();
    ctx.drawImage(img, 0, 0, c.width, c.height);
    var url = c.toDataURL("image/jpeg", JPEG_Q);
    if (!url || url.indexOf("data:image/jpeg") !== 0) return fallback();
    return { b64: url.split(",")[1], type: "image/jpeg" };
  }).catch(fallback);
}

// Model names on this API get renamed and retired often, so rather than hard
// code one, ask which models this key can actually use and remember the choice.
function modelList(){
  var saved = ls(K_MODEL);
  if (saved) return Promise.resolve(saved.split(","));
  return fetch(GAPI + "/models", { headers: proxyHeaders() })
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){
      if (!r.ok) throw new Error(gerr(r.status, d));
      return d;
    }); })
    .then(function(d){
      var usable = (d.models || []).filter(function(m){
        return (m.supportedGenerationMethods || []).indexOf("generateContent") >= 0 &&
          !/embed|aqa|tts|image-generation|live|native-audio/.test(m.name);
      }).map(function(m){ return m.name.replace(/^models\//, ""); });
      if (!usable.length) throw new Error("That Gemini key has no usable models.");
      // Prefer a current flash model. The lite variant first: reading titles
      // off boxes is easy, and lite is quicker and less often overloaded.
      // Speed matters more than cleverness for reading box titles. The 2.5
      // Flash models can have thinking switched fully off, so they come first.
      // Gemini 3 models cannot, so they are fallbacks, set to think as little
      // as they allow. Newer is not better here.
      // Free-tier daily allowances differ hugely: the Flash-Lite models get
      // around 500 requests a day, full Flash models around 20. So every
      // fallback stays among the Lite models, and a full Flash model is only
      // tried once every Lite model has failed.
      // Ranked by free daily allowance, from your AI Studio dashboard:
      // 3.x Flash-Lite ~500/day, 2.5 Flash-Lite 20/day, full Flash 20/day.
      // Pro and older models are not on the free tier at all.
      var score = function(n){
        var s = 0;
        if (/flash/.test(n)) s += 100;
        if (/lite/.test(n)) s += 200;
        if (/^gemini-3/.test(n)) s += 50;
        if (/pro/.test(n)) s -= 400;
        if (/tts|image|live|audio/.test(n)) s -= 400;
        if (/preview|exp/.test(n)) s -= 40;
        var v = parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [0, 0])[1]) || 0;
        return s + v;                     // newer wins only between equals
      };
      usable.sort(function(a,b){ return score(b) - score(a); });
      // Keep a long list: if one model is capped, the app keeps looking
      // rather than giving up.
      usable = usable.filter(function(n){ return score(n) > 0; }).slice(0, 8);
      ls(K_MODEL, usable.join(","));
      return usable;
    });
}

function gerr(status, body){
  var m = body && body.error && body.error.message;
  if (status === 403){ askPassword(true); return "PASSWORD"; }
  if (status === 400 || status === 401)
    return "Gemini rejected the request" + (m ? ": " + m : ".");
  if (status === 429){
    var daily = m && /per.?day|daily|PerDay/i.test(m);
    return daily
      ? "Gemini's daily free allowance is used up. It resets overnight (Pacific time)."
      : "Gemini is rate limiting. Wait a minute and try again.";
  }
  if (status === 404)
    return "Gemini could not find that model" + (m ? ": " + m : "") +
           " Remove and re-save your key in settings to pick a new one.";
  return "Gemini returned " + status + (m ? ": " + m : ".");
}

var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

// A model that just hit its limit is skipped for a while, so the next call
// does not waste a round trip being told the same thing.
var COOL = {};
function coolDown(model, daily){ COOL[model] = Date.now() + (daily ? 6 * 3600e3 : 65e3); }
function usableNow(models){
  var ok = models.filter(function(m){ return !(COOL[m] > Date.now()); });
  return ok.length ? ok : models;       // if everything is capped, try anyway
}

// Reading titles off boxes needs no reasoning. The 2.5 Flash models think
// before answering unless told not to, which only adds seconds here. Other
// models reject this setting, so it is only sent where it is understood.
function genConfig(model, json){
  var c = {};
  if (json) c.responseMimeType = "application/json";
  // The two families take different, mutually exclusive settings. Sending the
  // wrong one, or both, is rejected outright.
  if (/^gemini-2\.5-flash/.test(model)) c.thinkingConfig = { thinkingBudget: 0 };
  else if (/^gemini-3/.test(model) && /flash/.test(model))
    c.thinkingConfig = { thinkingLevel: "low" };
  return c;
}

function callModel(model, parts, json){
  return fetch(GAPI + "/" + model, {
    method: "POST",
    headers: proxyHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify({ contents: [{ parts: parts }],
                           generationConfig: genConfig(model, json) })
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if (r.ok) return d;
      var e = new Error(gerr(r.status, d)); e.status = r.status; throw e;
    });
  });
}

// 503 means that model is momentarily overloaded, which is common and transient.
// Wait and retry, then try the next model rather than failing the whole photo.
function gemini(parts, json, offset){
  return modelList().then(function(all){
    var models = usableNow(all);
    // Start later in the list when asked, so different jobs spend different
    // models' allowances instead of competing for one per-minute cap.
    if (offset && models.length > offset)
      models = models.slice(offset).concat(models.slice(0, offset));
    var attempt = function(mi, tries){
      var model = models[mi];
      return callModel(model, parts, json).then(function(d){
        busyNote = ""; return d;
      }).catch(function(e){
        var busyErr = e.status === 503 || e.status === 500 || e.status === 502;
        // One quick retry, then try a different model. Waiting out an
        // overloaded model is slower than simply asking another one.
        if (busyErr && tries < 1){
          busyNote = "Gemini is busy, retrying\u2026";
          if (screen === "busy") render();
          return sleep(400).then(function(){ return attempt(mi, tries + 1); });
        }
        if (e.status === 404){
          ls(K_MODEL, "");
          if (mi + 1 < models.length) return attempt(mi + 1, 0);
        }
        // Free-tier limits are counted per model, so another model usually
        // still has room even when this one is capped.
        if (e.status === 429) coolDown(model, /daily/.test(e.message));
        if (e.status === 429 && mi + 1 < models.length){
          busyNote = "Limit reached, trying another model\u2026";
          if (screen === "busy") render();
          return attempt(mi + 1, 0);
        }
        if (busyErr && mi + 1 < models.length){
          busyNote = "Busy, trying another model\u2026";
          if (screen === "busy") render();
          return attempt(mi + 1, 0);
        }
        busyNote = "";
        if (busyErr) throw new Error(
          "Gemini is overloaded right now. It usually clears in a minute or two.");
        throw e;
      });
    };
    return attempt(0, 0);
  }).then(function(d){
    var c = ((d.candidates||[])[0]||{}).content;
    return ((c && c.parts) || []).map(function(p){ return p.text || ""; }).join("");
  });
}

function jsonFrom(text, open, close){
  var t = String(text).replace(/```json|```/g, "").trim();
  var a = t.indexOf(open), b = t.lastIndexOf(close);
  if (a < 0 || b < 0) throw new Error("Could not read the reply.");
  return JSON.parse(t.slice(a, b + 1));
}

"showing the cover, or stand on the shelf showing only the spine, often printed sideways; read both.\n\n" +
"Return ONLY a JSON array of objects, no prose and no markdown fences:\n" +

// Comments are shown verbatim; the model only groups and points at them.
var K_SAYS = "shelfworthy.books.says";
function saysCache(){ try { return JSON.parse(ls(K_SAYS) || "{}"); } catch(e){ return {}; } }

function summarise(g){
  if (!gemKey() || !g.comments.length) return Promise.resolve(null);
  // Comments barely change week to week. Reuse a summary for 30 days rather
  // than spending a Gemini call every time the same game is opened.
  var cache = saysCache(), hit = cache[g.id];
  if (hit && Date.now() - hit.t < 30 * 864e5) return Promise.resolve(hit.s);
  return summariseFresh(g).then(function(s){
    if (s && s.length){
      var c = saysCache();
      c[g.id] = { t: Date.now(), s: s };
      var keys = Object.keys(c);
      if (keys.length > 150){                       // keep storage small
        keys.sort(function(a,b){ return c[a].t - c[b].t; });
        keys.slice(0, keys.length - 150).forEach(function(k){ delete c[k]; });
      }
      try { ls(K_SAYS, JSON.stringify(c)); } catch(e){}
    }
    return s;
  });
}

function summariseFresh(g){
  var numbered = g.comments.map(function(c, i){ return i + ". " + c.text; }).join("\n");
  return gemini([{ text:
"Here are reader reviews of the book \"" + g.name + "\"" + (g.author ? " by " + g.author : "") +
", each numbered.\n\n" + numbered +
"\n\nGroup them into recurring points of praise and recurring criticisms of the book itself. " +
"Ignore reviews that only quote the book, discuss the author's personal life, or say nothing " +
"about the reading experience. Never reveal plot twists or endings in a point.\n\n" +
"Return ONLY a JSON array, no prose and no markdown fences, at most 3 praise and 3 criticism:\n" +
'[{"dir":"up","point":"one short sentence","n":12,"i":3}]\n\n' +
'"dir" is up for praise and down for criticism. "n" is roughly how many reviews make that point. ' +
'"i" is the number of the single review that puts it best.' }], true, 1)
  .then(function(text){
    return jsonFrom(text, "[", "]").filter(function(s){
      return s && s.point && g.comments[s.i];
    }).map(function(s){
      var c = g.comments[s.i];
      return { dir: s.dir === "down" ? "down" : "up", point: String(s.point),
               n: parseInt(s.n,10) || 1, quote: c.text, who: c.who, rating: c.rating };
    });
  })
  .catch(function(){ return null; });
}

function sortedRows(){
  var list = matched().slice();
  if (sortKey === "shelf") return list;
  if (sortKey === "name") return list.sort(function(a,b){
    return a.game.name.localeCompare(b.game.name) * sortDir; });
  var col = COLS.filter(function(c){ return c[0]===sortKey; })[0];
  if (!col) return list;
  if (sortKey === "libby") return list.sort(function(a,b){ return (col[2](a.game) - col[2](b.game)) * sortDir; });
  return list.sort(function(a,b){
    var x = col[2](a.game), y = col[2](b.game);

    return ((y==null?-1:y) - (x==null?-1:x)) * sortDir;

function expandBook(id){
  var x = EXP[id];
  if (x){
    x.open = !x.open;
    if (!(x.open && x.state === "failed")){ render(); return; }   // a failed load retries on reopen
  }
  EXP[id] = { state: "loading", open: true }; render();
  var timeout = new Promise(function(res){ setTimeout(function(){ res("timeout"); }, 25000); });
  loadOne(id).then(function(g){
    if (g.says && g.says.length) return g.says;
    if (!g.comments.length) return "none";
    return Promise.race([summarise(g).catch(function(){ return "failed"; }), timeout]);
  }).then(function(s){
    var cur = EXP[id]; if (!cur) return;            // a new photo cleared the list
    if (s && s.length && typeof s !== "string"){ cur.state = "done"; cur.says = s; }
    else cur.state = s === "none" ? "none" : "failed";
    render();
  }).catch(function(e){
    if (e && e.message === "PASSWORD") return;
    if (EXP[id]){ EXP[id].state = "failed"; render(); }
  });
}

var fixFocus = null, fixSingle = false;

function startFixThis(){
  if (!game) return;
  var idx = -1;
  for (var i = 0; i < shelf.length; i++)
    if (shelf[i].game && shelf[i].game.id === game.id){ idx = i; break; }
  if (idx < 0){
    // Opened from a barcode or history, not a shelf: fix it on its own.
    shelf = [{ read: game.name, conf: true, game: game }];
    idx = 0; fixSingle = true;
  } else fixSingle = false;
  fixFocus = idx; msg = null;
  screen = "fix"; render(); window.scrollTo({ top: 0, behavior: "smooth" });
}

// After a focused fix, show the corrected game rather than the list.
function afterFix(i){
  if (fixFocus === null || !shelf[i] || !shelf[i].game) return false;
  fixFocus = null;
  openGame(shelf[i].game.id);
  return true;
}

function fixView(){
  var flagged = shelf.filter(function(r){ return !r.game || r.conf===false; });
  var clean   = shelf.filter(function(r){ return r.game && r.conf!==false; });
  function row(r){
    var i = shelf.indexOf(r), g = r.game;
    var why = !g ? (r.why || "Not found on Hardcover")
            : r.conf===false ? (r.why || "Read, but not certain") : "Read clearly";
    return '<div class="fixrow'+(!g||r.conf===false?" flagged":"")+'">'+
      '<span class="thumbwrap"><span class="thumb" style="background:'+
        (g?artColor(g.id):"#C3C9BE")+'">'+(g?(g.thumb?'<img src="'+esc(g.thumb)+'" alt="">':
        esc(initials(g.name))):"?")+'</span>'+
        (!g||r.conf===false?'<span class="flag'+(!g?" bad":"")+'" style="pointer-events:none">'+
        (!g?"!":"?")+'</span>':"")+'</span>'+
      '<div class="t">'+esc(g?g.name:(r.read||"Unreadable spine"))+'<small>'+esc(why)+'</small></div>'+
      '<button class="fixbtn" data-fixi="'+i+'">Change</button></div>'+
      '<div class="fixopts" data-opts="'+i+'" hidden>'+
        '<button class="btn ghost" data-fixscan="'+i+'">Scan this book\u2019s barcode</button>'+
        '<label class="btn ghost" style="display:block;text-align:center" tabindex="0">'+
          'Photograph it again<input type="file" accept="image/*" capture="environment" '+
          'data-fixshot="'+i+'" hidden></label>'+
        '<div class="row" style="margin-top:8px">'+
          '<input placeholder="Type the correct title" data-fixtitle="'+i+'">'+
          '<button data-fixset="'+i+'">Set</button></div>'+
        '<button class="pen" data-fixdrop="'+i+'">Remove from the list</button>'+
      '</div>';
  }
  if (fixFocus !== null && shelf[fixFocus]){
    var f = shelf[fixFocus];
    var html = row(f)
      .replace('data-opts="'+fixFocus+'" hidden', 'data-opts="'+fixFocus+'"')
      .replace(/<button class="fixbtn"[^>]*>Change<\/button>/, "")
      .replace(/<small>[^<]*<\/small>/, f.game && f.game.year ? "<small>"+f.game.year+"</small>" : "");
    return '<button class="back" data-go="detail">&larr; back to the book</button>'+
      notice()+'<h2>Fix this book</h2>'+
      '<p class="hint">Read it again, scan its barcode, or type the right title.</p>'+
      html+
      (fixSingle ? "" : '<button class="pen" data-fixall="1" style="margin-top:10px">'+
        'See the whole list instead</button>');
  }
  return '<button class="back" data-go="shelf">&larr; back to the shelf</button>'+
    notice()+'<h2>Fix the list</h2>'+
    '<p class="hint">Change any book, not just the flagged ones. A confident read can '+
    'still be the wrong book with the same title.</p>'+
    (flagged.length ? '<div class="grp">Needs a look &middot; '+flagged.length+'</div>'+
      flagged.map(row).join("") : "")+
    (clean.length ? '<div class="grp">Read clearly &middot; '+clean.length+'</div>'+
      clean.map(row).join("") : "")+
    '<button class="btn" data-go="shelf">Done</button>';
}

function tryPassword(){
  var v = (document.getElementById("passin").value || "").trim();
  var out = document.getElementById("passout");
  if (!v) return;
  out.innerHTML = '<p class="hint" style="margin-top:10px">Checking\u2026</p>';
  // Ask the server rather than trusting the phone: the check is only real there.
  fetch(HC, { method: "POST", headers: { "X-Shelf-Pass": v, "Content-Type": "application/json" },
              body: JSON.stringify({ query: "query { __typename }" }) })
    .then(function(r){
      if (r.status === 403){
        out.innerHTML = '<div class="note bad" style="margin-top:10px">'+
          '<b>Not that one</b>Check the spelling and capitals.</div>';
        return;
      }
      setPassword(v); passWrong = false; msg = null;
      screen = "idle"; render();
    })
    .catch(function(){
      out.innerHTML = '<div class="note bad" style="margin-top:10px">'+
        '<b>Could not reach the server</b>Check your signal and try again.</div>';
    });
}

  }).then(function(d){ LIBLIST = (d && d.libs) || []; LIBLIST_ERR = ""; return LIBLIST; })
    .catch(function(){ LIBLIST_ERR = "The library list isn\u2019t built yet. Use \u201cAdd by code\u201d below."; return []; });

function libResults(q){
  var out = document.getElementById("libres");
  if (!out) return;
  if (String(q).trim().length < 2){ out.innerHTML = ""; return; }

/* ============================ render ============================ */
function go(s){ screen = s; msg = null; render(); window.scrollTo({top:0,behavior:"smooth"}); }

function render(){
  if (screen !== "busy") showShot = false;
  var prev = document.querySelector(".scroller");
  var keepX = prev ? prev.scrollLeft : 0;

  document.getElementById("gear").className = "gear";

  var h;
  document.querySelector(".app").classList.toggle("slim", screen === "detail" && !!game);
  if (!password() && screen !== "pass") screen = "pass";
  if (screen === "pass")          h = passView();
  else if (screen === "scanning") h = scanView();
  else if (screen === "busy")     h = busyView();
  else if (screen === "picks")    h = picksView();
  else if (screen === "detail")   h = game ? detailView(game) : idleView();
  else if (screen === "shelf")    h = shelfView();
  else if (screen === "fix")      h = fixView();
  else if (screen === "compare")  h = compareView();
  else if (screen === "glossary") h = glossaryView();
  else if (screen === "history")  h = historyView();
  else                            h = idleView();
  el.innerHTML = h;

  var now = document.querySelector(".scroller");
  if (now && keepX) now.scrollLeft = keepX;

  wire();
  renderSheet();
  if (myLibs().length){
    if (screen === "shelf") matched().forEach(function(r){ loadLibby(r.game); });
    else if (screen === "detail" && game) loadLibby(game);
  }

  if (screen === "scanning"){
    var v = document.getElementById("cam");
    if (v && stream){ v.srcObject = stream; v.play().catch(function(){}); }
  }
}
