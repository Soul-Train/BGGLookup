function picksView(){
  var h = notice();
  if (picks.length){
    h += '<h2>Which one is it?</h2>'+
      '<p class="hint">The barcode matched more than one entry'+
      (searchedFor ? ', on "'+esc(searchedFor)+'"' : "")+'. Pick the right box, '+
      'or let the camera read the cover instead.</p>'+
      picks.map(function(p){
        return '<button class="pick" data-open="'+esc(p.id)+'">'+
          '<span class="n">'+esc(p.name)+'</span><span class="go">&rarr;</span></button>';
      }).join("")+
      photoOut("None of these look right?");
  } else {
    h += '<h2>Barcode not in the database</h2>'+
      '<p class="hint">Nobody has mapped that code yet. The cover works just as well.</p>'+
      photoOut("Photograph the box instead", true)+
      '<div class="grp">Or type it</div>'+
      '<div class="row"><input id="q2" placeholder="Game name"><button id="q2go">Search</button></div>';
  }
  return h + '<button class="btn ghost" data-go="idle">Scan another</button>';
}

function compareView(){
  var list = Object.keys(STARRED).map(function(k){ return STARRED[k]; });
  if (!list.length){
    return '<button class="back" data-go="idle">&larr; back</button>'+
      '<h2>Nothing shortlisted yet</h2>'+
      '<p class="hint">Tap Shortlist on any game to add it here. The list survives '+
      'while you photograph more shelves.</p>'+
      '<button class="btn ghost" data-go="idle">Back</button>';
  }
  list.sort(function(a,b){ return (b.avg||0) - (a.avg||0); });
  var ROWS = [
    ["Average",    function(g){ return g.avg?g.avg.toFixed(1):"&mdash;"; }, true],
    ["Weight",     function(g){ return g.weight?g.weight.toFixed(1):"&mdash;"; }, false],
    ["Players",    function(g){ return players(g)||"&mdash;"; }, false],
    ["Best with",  function(g){ return g.best?esc(g.best):"&mdash;"; }, false],
    ["Mins",       function(g){ return g.time||"&mdash;"; }, false],
    ["Age",        function(g){ return g.age?g.age+"+":"&mdash;"; }, false],
    ["Rank",       function(g){ return g.rank?"#"+g.rank:"&mdash;"; }, false],
    ["Typical US", function(g){ return g.us?"$"+g.us[1]:"&mdash;"; }, false],
    ["Store price",function(g){ return PRICE_IN[g.id]?"$"+PRICE_IN[g.id]:"&mdash;"; }, false]
  ];
  if (!list.some(function(g){ return PRICE_IN[g.id]; })) ROWS.pop();

  return '<button class="back" data-go="'+(shelf.length?"shelf":"idle")+'">&larr; back</button>'+
    '<h2>'+list.length+' shortlisted</h2>'+
    '<p class="hint">Kept across photos. Shortlist more as you go, then compare here.</p>'+
    '<div class="cmp"><div class="scroller"><table class="tbl cmptbl"><thead><tr><th>&nbsp;</th>'+
      list.map(function(g){
        return '<th class="hg"><span class="ch">'+thumb(g)+
          '<span class="cn">'+esc(g.name)+'</span></span></th>'; }).join("")+
    '</tr></thead><tbody>'+
      ROWS.map(function(r){
        var vals = list.map(r[1]);
        var nums = vals.map(parseFloat).filter(isFinite);
        var best = r[2] && nums.length ? Math.max.apply(null, nums) : null;
        return '<tr><td class="lb">'+r[0]+'</td>'+vals.map(function(v){
          return '<td'+(best!==null && parseFloat(v)===best ? ' class="win"' : "")+'>'+v+'</td>';
        }).join("")+'</tr>';
      }).join("")+
      '<tr><td class="lb">&nbsp;</td>'+list.map(function(g){
        return '<td><button class="mk2 star on" data-star="'+esc(g.id)+'" '+
          'title="Remove">\u2605</button></td>'; }).join("")+'</tr>'+
    '</tbody></table></div></div>'+
    '<label class="btn ghost" style="display:block;text-align:center" tabindex="0">'+
      'Photograph another shelf<input type="file" accept="image/*" capture="environment" '+
      'class="shotalt" hidden></label>'+
    '<button class="btn ghost" data-go="'+(shelf.length?"shelf":"idle")+'">Back</button>';
}

// When you fix from a game's own page, you mean that game, not the whole list.
var fixFocus = null, fixSingle = false;

function startFixThis(){
  if (!game) return;
  var idx = -1;
  for (var i = 0; i < shelf.length; i++)
    if (shelf[i].game && shelf[i].game.id === game.id){ idx = i; break; }
  if (idx < 0){
    // Opened from a barcode or history, not a shelf: fix it on its own.
    shelf = [{ read: game.name, conf: true, game: game }];
    idx = 0; fixSingle = true;
  } else fixSingle = false;
  fixFocus = idx; msg = null;
  screen = "fix"; render(); window.scrollTo({ top: 0, behavior: "smooth" });
}

// After a focused fix, show the corrected game rather than the list.
function afterFix(i){
  if (fixFocus === null || !shelf[i] || !shelf[i].game) return false;
  fixFocus = null;
  openGame(shelf[i].game.id);
  return true;
}

function fixView(){
  var flagged = shelf.filter(function(r){ return !r.game || r.conf===false; });
  var clean   = shelf.filter(function(r){ return r.game && r.conf!==false; });
  function row(r){
    var i = shelf.indexOf(r), g = r.game;
    var why = !g ? (r.why || "Not found on BoardGameGeek")
            : r.conf===false ? (r.why || "Read, but not certain") : "Read clearly";
    return '<div class="fixrow'+(!g||r.conf===false?" flagged":"")+'">'+
      '<span class="thumbwrap"><span class="thumb" style="background:'+
        (g?artColor(g.id):"#C3C9BE")+'">'+(g?(g.thumb?'<img src="'+esc(g.thumb)+'" alt="">':
        esc(initials(g.name))):"?")+'</span>'+
        (!g||r.conf===false?'<span class="flag'+(!g?" bad":"")+'" style="pointer-events:none">'+
        (!g?"!":"?")+'</span>':"")+'</span>'+
      '<div class="t">'+esc(g?g.name:(r.read||"Unreadable box"))+'<small>'+esc(why)+'</small></div>'+
      '<button class="fixbtn" data-fixi="'+i+'">Change</button></div>'+
      '<div class="fixopts" data-opts="'+i+'" hidden>'+
        '<button class="btn ghost" data-fixscan="'+i+'">Scan this game\u2019s barcode</button>'+
        '<label class="btn ghost" style="display:block;text-align:center" tabindex="0">'+
          'Photograph it again<input type="file" accept="image/*" capture="environment" '+
          'data-fixshot="'+i+'" hidden></label>'+
        '<div class="row" style="margin-top:8px">'+
          '<input placeholder="Type the correct title" data-fixtitle="'+i+'">'+
          '<button data-fixset="'+i+'">Set</button></div>'+
        '<button class="pen" data-fixdrop="'+i+'">Remove from the list</button>'+
      '</div>';
  }
  if (fixFocus !== null && shelf[fixFocus]){
    var f = shelf[fixFocus];
    var html = row(f)
      .replace('data-opts="'+fixFocus+'" hidden', 'data-opts="'+fixFocus+'"')
      .replace(/<button class="fixbtn"[^>]*>Change<\/button>/, "")
      .replace(/<small>[^<]*<\/small>/, f.game && f.game.year ? "<small>"+f.game.year+"</small>" : "");
    return '<button class="back" data-go="detail">&larr; back to the game</button>'+
      notice()+'<h2>Fix this game</h2>'+
      '<p class="hint">Read it again, scan its barcode, or type the right title.</p>'+
      html+
      (fixSingle ? "" : '<button class="pen" data-fixall="1" style="margin-top:10px">'+
        'See the whole list instead</button>');
  }
  return '<button class="back" data-go="shelf">&larr; back to the shelf</button>'+
    notice()+'<h2>Fix the list</h2>'+
    '<p class="hint">Change any game, not just the flagged ones. A confident read can '+
    'still be the wrong edition.</p>'+
    (flagged.length ? '<div class="grp">Needs a look &middot; '+flagged.length+'</div>'+
      flagged.map(row).join("") : "")+
    (clean.length ? '<div class="grp">Read clearly &middot; '+clean.length+'</div>'+
      clean.map(row).join("") : "")+
    '<button class="btn" data-go="shelf">Done</button>';
}

var TERMS = [
  ["Average", "The plain average of every rating people have given. This is the big number BoardGameGeek shows on a game's page."],
  ["Geek rating", "The average pulled toward the middle to stop a game with nine glowing ratings outranking one with fifty thousand. Always lower than the average. It is what the overall rank is built from."],
  ["Rank", "Position across every board game on the site, ordered by Geek rating. #1 is the highest rated game on BoardGameGeek."],
  ["Category rank", "Position within one category, like Strategy or Family. Often more useful than the overall rank, since a great party game will never outrank a heavy strategy game."],
  ["Weight", "How complex people found it, from 1 to 5. Roughly: under 2 is a filler you teach in five minutes, 2 to 3 is an evening game, 3 to 4 asks for real attention, above 4 is a commitment."],
  ["Best with", "The player count people voted plays best, which often disagrees with the range printed on the box. A box saying 2 to 6 can still be mediocre at 2."],
  ["Players", "The range the publisher prints on the box."],
  ["Mins", "Playing time in minutes, as published. Treat it as optimistic."],
  ["Ratings", "How many people rated it. A 9.0 from 40 people means much less than an 8.2 from 40,000."],
  ["Type", "Broad subject categories, like Economic or Animals. What the game is about."],
  ["Mechanics", "How the game actually works, like Worker Placement or Deck Building. Usually a better guide to whether you will enjoy it than the category."],
  ["Typical US", "The middle of current US marketplace listings on BoardGameGeek. Listings in other currencies are left out."]
];

function historyView(){
  if (!HISTORY.length){
    return '<button class="back" data-go="idle">&larr; back</button>'+
      '<h2>Nothing scanned yet</h2>'+
      '<p class="hint">Scans and shelf photos are listed here so you can reopen '+
      'them without photographing the shelf again.</p>'+
      '<button class="btn ghost" data-go="idle">Back</button>';
  }
  return '<button class="back" data-go="idle">&larr; back</button>'+
    '<h2>'+HISTORY.length+' in history</h2>'+
    '<p class="hint">Tap one to load it again. Ratings are refetched, so they '+
    'are current rather than whatever they were at the time.</p>'+
    HISTORY.map(function(h, i){ return histRow(h, i); }).join("")+
    '<button class="btn ghost" id="clearhist">Clear history</button>'+
    '<button class="btn ghost" data-go="idle">Back</button>';
}

function openHistory(i){
  var h = HISTORY[i];
  if (!h) return;
  if (h.ids.length === 1) return openGame(h.ids[0]);
  newCapture();
  busy = "Reloading " + h.ids.length + " games"; screen = "busy"; render();
  loadMany(h.ids).then(function(det){
    shelf = h.ids.map(function(id, n){
      return { read: h.names[n], conf: true, game: det[id] || null };
    });
    sortKey = "shelf"; sortDir = 1;
    screen = "shelf"; render();
  }).catch(function(e){
    fail(e); screen = "idle"; render();
  });
}

var passWrong = false;

function askPassword(wrong){
  if (wrong) setPassword("");
  passWrong = !!wrong;
  screen = "pass";
  // Defer so we are not re-rendering from inside a failing request chain.
  setTimeout(render, 0);
}

function passView(){
  return '<h2>'+(passWrong ? "That password did not work" : "Enter the password")+'</h2>'+
    '<p class="hint">'+(passWrong
      ? "It may have been changed. Ask whoever sent you the link for the current one."
      : "Whoever sent you the link will have given you a password. You only enter it once.")+
    '</p>'+
    '<div class="row"><input id="passin" type="text" autocomplete="off" autocapitalize="none" '+
      'spellcheck="false" placeholder="Password"></div>'+

    '<button class="btn" id="passgo">Continue</button>'+
    '<div id="passout"></div>';
}

function tryPassword(){
  var v = (document.getElementById("passin").value || "").trim();
  var out = document.getElementById("passout");
  if (!v) return;
  out.innerHTML = '<p class="hint" style="margin-top:10px">Checking\u2026</p>';
  // Ask the server rather than trusting the phone: the check is only real there.
  fetch(PROXY + "/bgg/thing?id=224517", { headers: { "X-Shelf-Pass": v } })
    .then(function(r){
      if (r.status === 403){
        out.innerHTML = '<div class="note bad" style="margin-top:10px">'+
          '<b>Not that one</b>Check the spelling and capitals.</div>';
        return;
      }
      setPassword(v); passWrong = false; msg = null;
      screen = "idle"; render();
    })
    .catch(function(){
      out.innerHTML = '<div class="note bad" style="margin-top:10px">'+
        '<b>Could not reach the server</b>Check your signal and try again.</div>';
    });
}

function glossaryView(){
  return '<button class="back" data-go="'+(shelf.length?"shelf":"idle")+'">&larr; back</button>'+
    '<h2>What the numbers mean</h2>'+
    '<p class="hint">All of these come from BoardGameGeek.</p>'+
    TERMS.map(function(x){
      return '<div class="term"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>';
    }).join("")+
    '<button class="btn ghost" data-go="'+(shelf.length?"shelf":"idle")+'">Back</button>';
}

/* ============================ settings ========================== */
function renderSheet(){
  if (!sheet){ modal.innerHTML = ""; return; }
  var t = token();
  modal.innerHTML =
    '<div class="sheet" id="scrim"><div class="inner">'+
      '<h2>Settings</h2>'+
      '<p class="hint" style="margin:-2px 0 10px">Version '+esc(APP_VERSION)+'</p>'+
      '<p class="hint">Nothing to set up. Ratings and photo reading go through a '+
      'shared server, so there are no keys to paste.</p>'+
      '<p class="hint" style="margin:16px 0 6px"><b>Game cache</b> (optional). '+
      'Paste the raw games.json link from your GitHub repo to match titles '+
      'without a lookup.</p>'+
      '<div class="row"><input id="cacheurl" placeholder="leave blank if hosted with the cache" '+
        'value="'+esc(ls(K_CACHE))+'" autocomplete="off" spellcheck="false"></div>'+
      (CACHE ? '<p class="hint" style="margin:6px 0 0">Holding '+CACHE.n+
        ' titles, built '+esc(CACHE.built||"")+'.</p>' : "")+
      '<button class="btn" id="savetok">Save</button>'+
      '<button class="btn ghost" id="testkeys">Test the connection</button>'+
      '<div id="testout"></div>'+
      '<button class="btn ghost" id="forgetpass">Change password</button>'+
      '<button class="btn ghost" data-go="glossary">What do Weight, Rank and the rest mean?</button>'+
      '<button class="btn ghost" id="closetok">Close</button>'+
    '</div></div>';

  document.getElementById("savetok").onclick = function(){
    var newCache = (document.getElementById("cacheurl").value||"").trim();
    if (newCache !== ls(K_CACHE)){
      ls(K_CACHE, newCache); ls(K_CACHED, ""); CACHE = null; CACHE_TRIED = false;
    }
    cacheIndex();
    sheet = false; msg = null; render();
  };
  document.getElementById("testkeys").onclick = function(){
    var out = document.getElementById("testout");
    out.innerHTML = '<div class="note">Testing\u2026</div>';
    var lines = [];
    var bggTest = bggFetch("thing?id=224517&stats=1")
          .then(function(x){
            var n = new DOMParser().parseFromString(x,"text/xml").querySelector("name");
            return "BoardGameGeek: working (read " +
              ((n && n.getAttribute("value")) || "a game") + ")";
          })
          .catch(function(e){ return "BoardGameGeek: " + e.message; });

    var gemTest = (ls(K_MODEL, ""), modelList())
          .then(function(ms){
            return gemini([{ text: "Reply with the single word: ok" }])
              .then(function(){ return "Gemini: working, using " + ms[0]; })
              .catch(function(e){ return "Gemini: found " + ms[0] + ", but " + e.message; });
          })
          .catch(function(e){ return "Gemini: " + e.message; });

    Promise.all([bggTest, gemTest]).then(function(r){
      var bad = r.some(function(s){ return !/working/.test(s); });
      out.innerHTML = '<div class="note'+(bad?" bad":"")+'">'+
        r.map(function(s){ return esc(s); }).join("<br>")+'</div>';
    });
  };

  var fp = document.getElementById("forgetpass");
  if (fp) fp.onclick = function(){ sheet = false; setPassword(""); askPassword(false); };

  var c = document.getElementById("cleartok");
  if (c) c.onclick = function(){ ls(K_MODEL,"");
    ls(K_CACHE,""); ls(K_CACHED,""); CACHE = null; CACHE_TRIED = false;
    sheet = false; render(); };
  document.getElementById("closetok").onclick = function(){ sheet = false; render(); };
  document.getElementById("scrim").onclick = function(e){
    if (e.target.id === "scrim"){ sheet = false; render(); }
  };
  Array.prototype.forEach.call(modal.querySelectorAll("[data-go]"), function(b){
    b.onclick = function(){ sheet = false; go(b.dataset.go); };
  });
}

/* ============================ render ============================ */
function go(s){ screen = s; msg = null; render(); window.scrollTo({top:0,behavior:"smooth"}); }

function render(){
  if (screen !== "busy") showShot = false;
  var prev = document.querySelector(".scroller");
  var keepX = prev ? prev.scrollLeft : 0;

  document.getElementById("gear").className = "gear";

  var h;
  if (!password() && screen !== "pass") screen = "pass";
  if (screen === "pass")          h = passView();
  else if (screen === "scanning") h = scanView();
  else if (screen === "busy")     h = busyView();
  else if (screen === "picks")    h = picksView();
  else if (screen === "detail")   h = game ? detailView(game) : idleView();
  else if (screen === "shelf")    h = shelfView();
  else if (screen === "fix")      h = fixView();
  else if (screen === "compare")  h = compareView();
  else if (screen === "glossary") h = glossaryView();
  else if (screen === "history")  h = historyView();
  else                            h = idleView();
  el.innerHTML = h;

  var now = document.querySelector(".scroller");
  if (now && keepX) now.scrollLeft = keepX;

  wire();
  renderSheet();

  if (screen === "scanning"){
    var v = document.getElementById("cam");
    if (v && stream){ v.srcObject = stream; v.play().catch(function(){}); }
  }
}

function wire(){
  var $ = function(s){ return document.getElementById(s); };
  if ($("passgo")) $("passgo").onclick = tryPassword;
  if ($("passin")){
    $("passin").onkeydown = function(e){ if (e.key === "Enter") tryPassword(); };
    setTimeout(function(){ $("passin") && $("passin").focus(); }, 50);
  }

  if ($("startcam")) $("startcam").onclick = startCamera;
  if ($("stopcam"))  $("stopcam").onclick  = stopCamera;
  if ($("shot")) $("shot").onchange = function(e){
    var f = e.target.files && e.target.files[0]; if (f) readPhoto(f);
  };
  if ($("tl")) $("tl").onclick = function(){
    var m = $("manual"); m.hidden = !m.hidden; if (!m.hidden) $("q").focus();
  };
  if ($("qgo")) $("qgo").onclick = submitManual;
  if ($("q"))   $("q").onkeydown = function(e){ if (e.key==="Enter") submitManual(); };
  if ($("q2go")) $("q2go").onclick = function(){
    var v = ($("q2").value||"").trim(); if (v) byName(v); };
  if ($("q2")) $("q2").onkeydown = function(e){
    if (e.key==="Enter") $("q2go").click(); };

  each(".shotalt", function(inp){ inp.onchange = function(e){
    var fl = e.target.files && e.target.files[0]; if (fl) readPhoto(fl); }; });
  each("[data-fixshot]", function(inp){ inp.onchange = function(e){
    var fl = e.target.files && e.target.files[0];
    if (fl) readPhoto(fl, parseInt(inp.dataset.fixshot, 10)); }; });

  each("[data-go]", function(b){ b.onclick = function(ev){
    ev.stopPropagation(); go(b.dataset.go); }; });

  each("[data-open]", function(b){ b.onclick = function(ev){
    if (ev.target.closest("[data-star],[data-own],[data-fixgo]")) return;
    openGame(b.dataset.open); }; });

  each("[data-fixgo]", function(b){ b.onclick = function(ev){
    ev.stopPropagation(); fixFocus = null; go("fix"); }; });
  each("[data-fixthis]", function(b){ b.onclick = function(ev){
    ev.stopPropagation(); startFixThis(); }; });
  each("[data-fixall]", function(b){ b.onclick = function(){
    fixFocus = null; render(); }; });

  each("[data-star]", function(b){ b.onclick = function(ev){
    ev.stopPropagation();
    var g = (game && game.id === b.dataset.star) ? game
          : STARRED[b.dataset.star] || findLoaded(b.dataset.star);
    if (g) { toggleStar(g); render(); }
  }; });
  each("[data-own]", function(b){ b.onclick = function(ev){
    ev.stopPropagation();
    var g = (game && game.id === b.dataset.own) ? game : findLoaded(b.dataset.own);
    if (g) { toggleOwn(g); render(); }
  }; });

  each("[data-sort]", function(b){ b.onclick = function(){
    var k = b.dataset.sort;
    if (k === sortKey && k !== "shelf") sortDir = -sortDir;
    else { sortKey = k; sortDir = 1; }
    render();
  }; });

  each("[data-toggle]", function(b){ b.onclick = function(){
    var body = b.parentNode.querySelector(".body"); body.hidden = !body.hidden; }; });

  each("[data-setprice]", function(b){ b.onclick = function(){
    var inp = document.querySelector('[data-priceinput="'+b.dataset.setprice+'"]');
    var v = parseFloat((inp.value||"").replace(/[^0-9.]/g,""));
    if (isFinite(v) && v > 0){ PRICE_IN[b.dataset.setprice] = Math.round(v); render(); }
  }; });
  each("[data-clearprice]", function(b){ b.onclick = function(){
    delete PRICE_IN[b.dataset.clearprice]; render(); }; });
  each("[data-priceinput]", function(inp){ inp.onkeydown = function(e){
    if (e.key === "Enter") document.querySelector('[data-setprice="'+
      inp.dataset.priceinput+'"]').click(); }; });

  each("[data-hist]", function(b){ b.onclick = function(){
    openHistory(parseInt(b.dataset.hist, 10)); }; });
  if ($("clearhist")) $("clearhist").onclick = function(){
    forgetAll(); render(); };

  each("[data-fixi]", function(b){ b.onclick = function(){
    var o = document.querySelector('[data-opts="'+b.dataset.fixi+'"]');
    if (o) o.hidden = !o.hidden; }; });
  each("[data-fixdrop]", function(b){ b.onclick = function(){
    var wasFocused = fixFocus !== null;
    shelf.splice(+b.dataset.fixdrop, 1);
    fixFocus = null; game = null;
    if (!shelf.length || fixSingle){ fixSingle = false; shelf = []; go("idle"); }
    else if (wasFocused) go("shelf");
    else render(); }; });
  each("[data-fixscan]", function(b){ b.onclick = function(){ startCamera(+b.dataset.fixscan); }; });
  each("[data-fixset]", function(b){ b.onclick = function(){
    var inp = document.querySelector('[data-fixtitle="'+b.dataset.fixset+'"]');
    var v = (inp.value||"").trim();
    if (v) replaceRow(+b.dataset.fixset, v);
  }; });
}

function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }

function findLoaded(id){
  if (game && game.id === id) return game;
  var r = shelf.filter(function(x){ return x.game && x.game.id === id; })[0];
  return r ? r.game : (STARRED[id] || null);
}

/* ============================ actions =========================== */
function fail(e){
  if (e && e.message === "PASSWORD") return;     // the password screen explains it
  msg = "<b>Something went wrong</b>" + esc(e && e.message ? e.message : String(e));
  msgBad = true;
}

function needToken(){ return false; }   // the server holds the keys

function openGame(id){
  if (needToken()) return;
  busy = "Loading the game"; screen = "busy"; showShot = false; render();
  loadOne(id)
    .then(function(g){
      game = g;
      rememberOne(g);
      screen = "detail"; render();
      return summarise(g).then(function(s){
        if (s && s.length && game && game.id === g.id){ game.says = s; render(); }
      });
    })
    .catch(function(e){
      fail(e);
      picks = [{ id: id, name: "This game" }];
      screen = shelf.length ? "shelf" : "picks"; render();
    });
}

function byName(q){
  if (needToken()) return;
  busy = "Searching BoardGameGeek"; screen = "busy"; render();
  findId(q).then(function(id){
    if (!id){ msg = "<b>No match</b>Nothing on BoardGameGeek matched \u201c"+esc(q)+"\u201d.";
      msgBad = true; screen = "idle"; render(); return; }
    openGame(id);
  }).catch(function(e){ fail(e); screen = "idle"; render(); });
}

function submitManual(){
  var v = (document.getElementById("q").value||"").trim();
  if (!v) return;
  if (/^[0-9]{6,14}$/.test(v)) lookup(v); else byName(v);
}

/* --- barcode --- */
var fixTarget = null;

function startCamera(target){
  msg = null; busyNote = "";
  fixTarget = (typeof target === "number") ? target : null;
  if (!("BarcodeDetector" in window)){
    msg = "<b>This browser cannot scan barcodes</b>Chrome on Android works. On iPhone, "+
          "take a photo of the box instead, or type the number.";
    msgBad = true; screen = "idle"; render(); return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    msg = "<b>No camera available</b>Type the barcode number instead.";
    msgBad = true; screen = "idle"; render(); return;
  }
  detector = detector || new window.BarcodeDetector({
    formats: ["ean_13","upc_a","ean_8","upc_e","code_128"] });
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" } }, audio:false })
    .then(function(s){ stream = s; screen = "scanning"; scanning = true; render(); tick(); })
    .catch(function(){
      msg = "<b>Camera blocked</b>Allow camera access in your browser settings, "+
            "or type the number instead.";
      msgBad = true; screen = "idle"; render();
    });
}

function stopCamera(){
  scanning = false;
  if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  if (screen === "scanning"){ screen = "idle"; render(); }
}

function tick(){
  if (!scanning) return;
  var v = document.getElementById("cam");
  if (v && v.readyState >= 2){
    detector.detect(v).then(function(codes){
      if (!scanning) return;
      if (codes && codes.length){
        var raw = String(codes[0].rawValue||"").replace(/\D/g,"");
        if (raw){ stopCamera(); lookup(raw); return; }
      }
      requestAnimationFrame(tick);
    }).catch(function(){ requestAnimationFrame(tick); });
  } else requestAnimationFrame(tick);
}

function lookup(upc){
  var keepFix = fixTarget;
  if (keepFix !== null && shelf[keepFix]) startCorrection();
  else newCapture();
  fixTarget = keepFix;
  lastUPC = upc;
  busy = "Looking up " + upc; screen = "busy"; render();
  fetch(UPC_URL + encodeURIComponent(upc), { headers: { "x-api-key": UPC_KEY } })
    .then(function(r){ if (!r.ok) throw new Error("bad"); return r.json(); })
    .then(function(d){
      searchedFor = d.searched_for || "";
      var verified = d.bgg_info_status === "verified";
      picks = (d.bgg_info||[]).filter(function(g){ return g && g.id && g.name; })
        .map(function(g){ return { id:String(g.id), name:g.name }; });
      if (verified) picks = picks.slice(0,1);
      if (fixTarget !== null && picks.length === 1) return replaceRowById(fixTarget, picks[0].id);
      if (picks.length === 1 && verified) return openGame(picks[0].id);
      screen = "picks"; render();
    })
    .catch(function(){
      msg = "<b>Could not reach the barcode service</b>Check your signal, or photograph the box.";
      msgBad = true; picks = []; screen = "picks"; render();
    });
}

/* --- photo --- */
function newCapture(){
  // Anything left from the last scan should not linger behind the next one.
  game = null; picks = []; shelf = []; reads = [];
  lastUPC = ""; searchedFor = ""; shotURL = null; fixTarget = null;
  sortKey = "shelf"; sortDir = 1; msg = null; busyNote = "";
}

// Correcting a single row is not a new capture: the rest of the shelf stays.
function startCorrection(){
  game = null; picks = []; lastUPC = ""; searchedFor = "";
  shotURL = null; msg = null; busyNote = "";
}

function readPhoto(file, fixIndex){
  var correcting = (typeof fixIndex === "number" && shelf[fixIndex]);
  if (correcting){ startCorrection(); fixTarget = fixIndex; }
  else newCapture();
  shotURL = URL.createObjectURL(file);
  busy = "Reading the boxes"; screen = "busy"; showShot = true; render();
  cacheIndex();
  var T0 = Date.now(), T1 = 0, T2 = 0;
  readTitles(file).then(function(list){
    T1 = Date.now();
    if (!list.length) throw new Error("No titles were legible. Get closer, or square up to the shelf.");
    reads = list;
    busy = "Matching " + list.length + " on BoardGameGeek"; render();
    return Promise.all(list.map(function(o){
      return findId(o.title).then(function(id){
        return { read:o.title, id:id, conf:o.sure, why:o.why };
      });
    }));
  }).then(function(found){
    T2 = Date.now();
    var ids = found.filter(function(f){ return f.id; }).map(function(f){ return f.id; });
    return (ids.length ? loadMany(ids) : Promise.resolve({})).then(function(det){
      var T3 = Date.now();
      lastTiming = { read: T1 - T0, match: T2 - T1, details: T3 - T2, at: T3 };
      var rows = found.map(function(f){
        return { read:f.read, conf:f.conf, why:f.why, game: (f.id && det[f.id]) || null };
      });

      if (correcting){
        // Put the best read into the row being corrected and go back to the list.
        var pick = rows.filter(function(r){ return r.game; })[0] || rows[0];
        var fixedAt = fixTarget;
        shelf[fixTarget] = { read: pick.read, conf: pick.conf !== false, game: pick.game };
        fixTarget = null;
        if (rows.length > 1)
          msg = "<b>Read " + rows.length + " titles</b>Used the first match for that row.";
        if (afterFix(fixedAt)) return;
        screen = "fix"; render();
        return;
      }

      shelf = rows;
      sortKey = "shelf"; sortDir = 1;
      remember(shelf);
      if (shelf.length === 1 && shelf[0].game) return openGame(shelf[0].game.id);
      screen = "shelf"; render();
    });
  }).catch(function(e){
    if (e && e.message === "PASSWORD") return;   // the password screen is already up
    msg = "<b>Could not read that photo</b>"+esc(e.message||"Something went wrong.");
    msgBad = true; screen = "idle"; render();
  });
}

/* --- corrections --- */
function replaceRowById(i, id){
  busy = "Loading the game"; screen = "busy"; showShot = false; render();
  return loadOne(id).then(function(g){
    if (shelf[i]) shelf[i] = { read:g.name, conf:true, game:g };
    fixTarget = null;
    if (afterFix(i)) return;
    screen = shelf.length ? "fix" : "idle"; render();
  }).catch(function(e){ fail(e); screen = "fix"; render(); });
}
function replaceRow(i, title){
  busy = "Searching BoardGameGeek"; screen = "busy"; render();
  findId(title).then(function(id){
    if (!id){ msg = "<b>No match</b>Nothing matched \u201c"+esc(title)+"\u201d.";
      msgBad = true; screen = "fix"; render(); return; }
    return replaceRowById(i, id);
  }).catch(function(e){ fail(e); screen = "fix"; render(); });
}

document.getElementById("gear").onclick = function(){ sheet = true; render(); };
document.getElementById("ver").textContent = "Version " + APP_VERSION;
cacheIndex();
render();
</script>
