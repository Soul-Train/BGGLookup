name: Weekly game cache

"on":
  schedule:
    - cron: "20 8 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: How many games to keep
        default: "6000"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build cache
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          LIMIT: ${{ inputs.limit || '6000' }}
        run: python scripts/build_cache.py
      - name: Show result
        run: cat data/meta.json
      - name: Commit
        run: |
          git config user.name cache-bot
          git config user.email cache-bot@users.noreply.github.com
          git add data/
          git diff --cached --quiet || git commit -m "Weekly cache $(date -u +%Y-%m-%d)"
          git push
