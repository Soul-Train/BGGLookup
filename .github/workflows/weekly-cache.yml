name: Weekly game cache

"on":
  schedule:
    - cron: "20 8 * * 0"
  workflow_dispatch:
    inputs:
      budget:
        description: Minutes to spend fetching
        default: "90"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build cache
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          BUDGET_MIN: ${{ inputs.budget || '90' }}
        run: python scripts/build_cache.py
      - name: Show result
        if: always()
        run: cat data/meta.json || echo "no cache written"
      # The script checkpoints and pushes as it goes, so this only catches
      # whatever happened after the last checkpoint.
      - name: Commit anything left over
        if: always()
        run: |
          git config user.name cache-bot
          git config user.email cache-bot@users.noreply.github.com
          git add data/
          git diff --cached --quiet || git commit -m "Weekly cache $(date -u +%Y-%m-%d)"
          git push || true