name: Weekly library list

"on":
  schedule:
    - cron: "40 9 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build library list
        run: python scripts/build_libraries.py
      - name: Commit if changed
        run: |
          git config user.name cache-bot
          git config user.email cache-bot@users.noreply.github.com
          git add data/libraries.json
          git diff --cached --quiet || git commit -m "Library list $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push
